Let the overtures tell of your great deeds, oh Wilhelm Tell, first Eidgenosse, folk legend, expert marksman, and he whose defiance and tyrannicide set the people of the old Swiss Confederacy free. The legends say you were born in Bürglen, Uri. Growing up to become a strong man, you grew to become disillusioned with the Habsburg emperors of Austria attempted domination of Uri and vowed to act. Becoming one of the conspirators of Werner Stauffacher, you resisted the Austrian Vogt of Altdorf, Albrecht Gessler. On your journey to the eventual assassination of Gessler, you partook in misadventures, including your famous splitting of the apple on your son’s head by a shot from your crossbow, your imprisonment, and escape from the Tellsplatte. Your assassination of Gessler led to a rebellion, which led to the formation of the Old Swiss Confederacy. Brave to the end, legend says you continued to fight the Austrians, and died trying to save a child from drowning.  = 让序曲讲述你的丰功伟绩吧，哦，威廉·退尔，第一位瑞士盟约者，民间传奇，神射手，他反抗和弑暴君的行为使旧瑞士邦联的人民获得了自由。传说你出生在乌里的比格伦。长大成为一个强壮的人后，你对奥地利哈布斯堡皇帝试图统治乌里感到幻灭，并誓言采取行动。成为维尔纳·斯陶法赫的同谋之一后，你反抗了奥地利的阿尔特多夫总督阿尔布雷希特·格斯勒。在最终刺杀格斯勒的旅程中，你经历了许多冒险，包括用十字弩射中儿子头上的苹果的著名事件，你的被捕，以及从泰尔石板的逃脱。你刺杀格斯勒引发了叛乱，这导致了旧瑞士邦联的形成。传说中你勇敢到最后一刻，继续与奥地利人作战，并在试图救一名溺水儿童时丧生。
Oh Wilhelm Tell, your people once again crave the daring, bravery and strength. You must awaken from your cave at the Rigi. But beware, the world has changed; new challenges must be conquered, and if you are to live up to your legend, you must once again rise to fight those who would seek to destroy you. Can you live up to the expectations of your people? Can you build a civilization that will stand the test of time? = 哦，威廉·退尔，你的人民再次渴望你的胆识、勇敢和力量。你必须从瑞吉山的洞穴中醒来。但要小心，世界已经改变；必须征服新的挑战，如果你想不负你的传奇，你必须再次站起来，与那些试图摧毁你的人战斗。你能不辜负人民的期望吗？你能建立一个经得起时间考验的文明吗？
