Hail to you, Philip the Magnanimous, Landgrave of Hesse and stalwart champion of the Protestant Reformation. Elevated by your unwavering conviction, you stood defiant against the might of the Holy Roman Emperor to protect the reformed faith. Through the Marburg Colloquy, you sought to unite the great theological minds of your age, and as a founding leader of the Schmalkaldic League, you forged a mighty alliance to defend the religious liberties of the German princes. Your legacy is one of fierce independence and religious zeal, forever etching Hesse into the annals of history. = 向你致敬，宽宏者腓力，黑森领地伯爵，新教改革的坚强捍卫者。在你不动摇的信念驱使下，你公然反抗神圣罗马皇帝的权威以保护改革后的信仰。通过马尔堡宗教会议，你试图团结你那个时代伟大的神学思想家，作为施马尔卡尔登联盟的创始领导人，你建立了一个强大的联盟来捍卫德意志诸侯的宗教自由。你的遗产是强烈的独立和宗教热情，将黑森永远铭刻在历史的史册中。
Most magnanimous Landgrave, the faithful look to you once more for guidance and protection. Can you unite the fractured realms and stand strong against imperial tyranny? Can you ensure that the light of your reforms burns bright across the ages? Can you build a civilization that will stand the test of time? = 最宽宏的领地伯爵，信徒们再次向你寻求指导和保护。你能团结支离破碎的领域，坚决对抗帝国的暴政吗？你能确保你的改革之光照耀千古吗？你能建立一个经得起时间考验的文明吗？
