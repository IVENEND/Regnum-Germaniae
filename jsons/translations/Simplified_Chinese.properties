Your words are the babble of the faithless. I shall pray for your swift and righteous judgment. = 你的话是背信弃义者的胡言乱语。我将为你迅速而公正的审判祈祷。
God's blessings upon you, traveler. I am Julius Echter, Prince-Bishop of Würzburg. Step into the light of our faith and speak your purpose. = 愿上帝保佑你，旅行者。我是维尔茨堡的亲王主教尤利乌斯·埃希特。步入我们信仰的光芒之中，说出你的目的。
A proposal of worldly goods. Review it with a careful and righteous mind. = 一份关于世俗物资的提案。以谨慎和正直的心去审视它。
May the Lord guide our words. = 愿主引导我们的言辞。
Do not test my patience, lest you find my mercy lacking. = 不要考验我的耐心，免得你发现我缺乏仁慈。
A Rugged Land of Fortresses = 崎岖要塞之国
Greetings to you, Julius Echter von Mespelbrunn, devoted Prince-Bishop of Würzburg. As a resolute pillar of the Holy Roman Empire, you guided your bishopric through a turbulent era of religious strife, standing as a fierce champion of the Counter-Reformation. Your legacy is not only one of unyielding spiritual fervor, but of magnificent creation. From the distinctive towering spires of your countless churches to the establishment of the great University and the Juliusspital, your tireless ambition transformed Würzburg into a true bastion of faith, education, and architectural splendor. = 向你致敬，尤利乌斯·埃希特·冯·梅斯佩尔布伦，忠诚的维尔茨堡亲王主教。作为神圣罗马帝国坚定的支柱，你带领你的教区度过了宗教冲突的动荡时代，作为反宗教改革的激烈拥护者而屹立不倒。你的遗产不仅是不屈的宗教狂热，还有宏伟的创造。从你无数教堂独特的耸立尖顶，到建立伟大的大学和尤利乌斯医院，你不知疲倦的雄心将维尔茨堡变成了一个真正的信仰、教育和建筑辉煌的堡垒。
Zealous shepherd of your flock, the grand halls of Marienberg Fortress await your divine mandate once more. Can you foster a realm of unrivaled devotion and enlightenment? Can you shield your lands from heresy and guide your people to salvation through faith and monumental works? Can you build a civilization that will stand the test of time? = 狂热的牧羊人，玛利恩堡要塞的大厅再次等待着你的神圣使命。你能培育一个拥有无与伦比的奉献精神和开明思想的国度吗？你能保护你的土地免受异端邪说的侵害，并通过信仰和不朽的作品引导你的人民获得拯救吗？你能建立一个经得起时间考验的文明吗？
