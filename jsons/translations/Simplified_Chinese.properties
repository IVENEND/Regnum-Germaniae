Matthias Corvinus = 马加什·科努维斯
Your insolence has provoked this war, and I shall be happy to lead the Black Army to victory over you. = 你的傲慢引发了这场战争，我将很乐意带领黑军击败你，赢得胜利。
Surely you had to know that one day there would be war between us. = 你肯定知道总有一天我们之间会有一战。
Today you wear the victor's laurels, but can you keep what you have taken? = 今天你戴着胜利者的桂冠，但你能保住你所夺走的东西吗？
The harsh judgments of the ignorant carry no weight in my court. = 无知者苛刻的评判在我的宫廷里毫无分量。
I am Matthias. I am King of Hungary, scourge of my foes, and defender of the faithful. Greetings. = 我是马加什。我是匈牙利国王，敌人的克星，信徒的守护者。向你致敬。
A fair exchange benefits both our realms. Review these terms. = 公平的交换对我们两方都有利。审阅这些条款吧。
Hussar Tradition = 骠骑兵传统
Hail to you, O' noble Matthias Corvinus, King of Hungary and Croatia. Rising to the throne amidst the turmoil of Europe, you forged a mighty realm renowned for both its martial prowess and its dazzling intellect. Your legendary Black Army stood as an unyielding bulwark against the Ottoman advance and secured your conquests in Bohemia and Austria. Yet, you were not merely a conqueror; as a true champion of the Renaissance, your grand court at Buda and the magnificent Bibliotheca Corviniana attracted scholars and artists from across the known world, cementing Hungary's legacy as a beacon of culture and strength. = 向你致敬，高贵的马加什·科努维斯，匈牙利和克罗地亚国王。在欧洲动荡中登上王位，你建立了一个以军事实力和耀眼智慧而闻名的强大国家。你传奇的黑军成为了对抗奥斯曼帝国进攻的不屈堡垒，并确保了你在波希米亚和奥地利的征服。然而，你不仅仅是一个征服者；作为真正的文艺复兴拥护者，你在布达的宏伟宫廷和壮丽的科维尼亚纳图书馆吸引了来自已知世界的学者和艺术家，巩固了匈牙利作为文化和力量灯塔的遗产。
Mighty Matthias, your feats at arms are matched only by the depths of your knowledge. Let your mighty Black Army serve as your strong hand in the battlefield, both as sword against your enemies and as shield protecting your faithful people, and ages to come will utter your name in awe. = 强大的马加什，你在军事上的壮举只有你知识的深度可以媲美。让你强大的黑军作为你在战场上的强力手腕，既作为对抗敌人的剑，也作为保护你忠实人民的盾，后世将怀着敬畏说出你的名字。
