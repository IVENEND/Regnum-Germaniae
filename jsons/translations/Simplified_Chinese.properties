René II = 勒内二世
You have achieved what the boldest and most powerful men of the age could not. I would be awed, were I not so disgusted. = 你做到了这个时代最大胆、最有权势的人都做不到的事情。如果不是如此厌恶，我本会感到敬畏的。
Your ambitions are as transparent as they are tyrannical. I see through your lies, and the world shall know of them too. = 你的野心显露无疑，就像你的暴政一样。我看穿了你的谎言，世界也会知道的。
Well met, stranger! I am René II, and I rule these lands as their Duke. Let it be known that Lorraine has never been conquered, and has resisted foes far more fearsome than it! If you aim to conquer us, your armies will fall like the others. Feel free to try, though. I do enjoy a challenge. = 幸会，陌生人！我是勒内二世，我作为公爵统治着这些土地。你要知道，洛林从未被征服过，并且抵抗过比它可怕得多的敌人！如果你想征服我们，你的军队会像其他人一样倒下。不过你可以尽情尝试。我确实喜欢挑战。
I bring a proposal that would benefit our realms. I suggest you look it over carefully. = 我带来了一份有益于我们领地的提案。我建议你仔细看看。
Speak your mind. = 说出你的想法。
Make it quick. My patience for you wears thin. = 快点。我对你的耐心越来越少了。
Legacy of Lotharingia = 洛塔林吉亚的遗产
We salute you, René II, most valiant of princes, Hercules of our times, who dared challenge the Lion to combat! You rule as Duke of Lorraine, the heir to the old kingdom of Lotharingia, a land both in France and in the Holy Roman Empire. Your duchy is a bountiful and fertile one, but even more so than that, a fiercely independent one. Lorraine was never conquered, only inherited. And what better symbol of Lorrainian resilience is there than you, great René? As a young duke, your domain was threatened by the powerful and ambitious Charles the Bold of Burgundy, who swept into your proud duchy with a seemingly insurmountable modern army. Unbowed and undeterred, you and your allies struck back against the Burgundians, routing their armies at the gates of Nancy and slaying Lorraine's would-be conqueror! Your heroic deeds will live on forever, in history and in poetry. = 向你致敬，勒内二世，最英勇的亲王，我们时代的赫拉克勒斯，敢于挑战雄狮的战士！你统治着洛林公国，这是古老洛塔林吉亚王国的继承者，一块横跨法国和神圣罗马帝国的土地。你的公国富饶而肥沃，但更重要的是，它极度独立。洛林从未被征服过，只能被继承。还有什么比你，伟大的勒内，更能代表洛林的韧性呢？作为一名年轻的公爵，你的领地受到强大而野心勃勃的勃艮第大胆查理的威胁，他带着一支看似不可战胜的现代军队席卷了你骄傲的公国。你和你的盟友不屈不挠，向勃艮第人发起反击，在南锡城门外击溃了他们的军队，杀死了洛林的潜在征服者！你的英雄事迹将永远活在历史和诗歌中。
Valiant René, the people of Lorraine once more call out for a tenacious hand to see them through the tribulations that lie ahead. Will you once more defend your duchy, and bring it into a new age of prestige and prosperity? Will you build a civilization that can stand the test of time? = 英勇的勒内，洛林人民再次呼唤一双坚韧的手来帮助他们度过未来的磨难。你会再次保卫你的公国，并带领它进入一个声望与繁荣的新时代吗？你能建立一个经得起时间考验的文明吗？
