Greetings to you. I am Frederick V, Elector Palatine and rightful King of Bohemia. Let us speak of diplomacy and peace, while we still can. = 你们好。我是普法尔茨选帝侯、波希米亚合法国王腓特烈五世。让我们趁还有机会的时候谈谈外交与和平吧。
