Bogislaw X = 波吉斯瓦夫十世
The Griffin bares its claws. The time for diplomacy has passed, and I now bring war to your lands. = 狮鹫亮出了它的利爪。外交的时间已经过去，我现在把战争带到你的土地上。
You dare threaten the sovereignty of Pomerania? We have weathered far fiercer storms than you. = 你竟敢威胁波美拉尼亚的主权？我们经受过比你猛烈得多的风暴。
I guess this is the end of a united Pomerania... = 我猜这就是统一的波美拉尼亚的终结了……
Greetings, wise ruler! I am Bogislaw X, the first to unite the whole of Pomerania in centuries. Some call me 'the Great' - perhaps you will soon be one of them? = 你好，睿智的统治者！我是波吉斯瓦夫十世，几个世纪以来第一位统一整个波美拉尼亚的人。有些人称我为“伟大者”——也许你很快就会成为他们中的一员？
A prosperous exchange on the Baltic benefits us both. I ask that you consider this offer. = 波罗的海上繁荣的交流对我们双方都有利。我要求你考虑这个提议。
What news do you bring to my court? = 你给我的宫廷带来了什么消息？
