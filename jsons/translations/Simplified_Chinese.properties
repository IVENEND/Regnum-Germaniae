God is with you. Did you come to learn of our Lords teachings, heathen? I am Albert of Livonia, who shall bring faith to this land. = 上帝与你同在。你是来学习我们主的教义的吗，异教徒？我是利沃尼亚的阿尔布雷希，将把信仰带到这片土地上的人。
Terra Mariana = 圣母之地
Albert of Buxhoeveden, God's blessing is with you and your ambitions. As the Livonian Chronicles are telling it to this day, you were the noble founder of Riga, once you called for a perpetual crusade against the heathens at the baltic shores to avenge your fallen brother in faith, who was Bishop before. But it was you o' brave Albert, who rose to Arch Bishop and even Prince-Bishop in the Reich with your glory that was in the conquest of the Land of Mary, founding Riga and securing it with the Order of the Sword Brethren. = 阿尔布雷希·冯·布克斯霍夫登，上帝的祝福与你和你的雄心同在。正如今天的《利沃尼亚编年史》所说，你是里加的高贵缔造者，你曾呼吁对波罗的海沿岸的异教徒发动永久十字军东征，为你曾担任主教的阵亡信仰兄弟复仇。但正是你，勇敢的阿尔布雷希，凭借征服玛利亚之国的荣耀晋升为大主教，甚至成为帝国的亲王主教，建立了里加，并用宝剑骑士团保卫它。
Ambitious Albert of Riga the heathens are on the rise again, the fertile lands, tranquil waters and dark forrests are waiting for your Excellency. Can you build a civilization that can stand the test of time? = 雄心勃勃的里加的阿尔布雷希，异教徒正在再次崛起，肥沃的土地、宁静的水域和幽暗的森林正在等待着阁下。你能建立一个经得起时间考验的文明吗？
