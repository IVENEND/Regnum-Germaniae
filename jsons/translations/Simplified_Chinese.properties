Welcome, Frederick Augustus I, elector of Saxony. You lead one of the cultural centres of Europe. Saxony is a modest country, with a wealth of art and architecture to its name. Elector to the Holy Roman Empire, Saxony rose to prominence during the 16th century, as home to the Protestant Reformation. In the 17th century, you joined Saxony in union with the Commonwealth of Poland-Lithuania, and embarked upon great projects which would make Dresden the envy of artists the world over. Even today, the legacy of your endeavours persist, and Saxony remains one of the most culturally autonomous states in Germany. = 欢迎你，萨克森选帝侯腓特烈·奥古斯特一世。你领导着欧洲的文化中心之一。萨克森是一个不起眼的国家，却拥有丰富的艺术和建筑财富。作为神圣罗马帝国的选帝侯，萨克森在16世纪崛起，成为新教改革的发源地。在17世纪，你促成了萨克森与波兰-立陶宛联邦的联合，并着手进行伟大的工程，使德累斯顿成为全世界艺术家羡慕的对象。即使在今天，你的努力留下的遗产依然存在，萨克森仍然是德意志最具文化自治性的邦国之一。
