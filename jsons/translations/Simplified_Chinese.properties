Palatinate Tolerance = 宗教宽容
Honour to you, Elector Frederick V of the Palatinate. Thrust into the center of a great religious struggle, your realm of the Electoral Palatinate stood as a leading voice for the Protestant cause in the Holy Roman Empire. When the rebellious estates of Bohemia offered you their crown, your bold acceptance ignited the devastating Thirty Years' War. Though your reign in Prague was tragically brief, earning you the immortal moniker of the 'Winter King', your legacy as a champion of your faith and the visionary behind Heidelberg's magnificent gardens remains forever etched in the annals of European history. = 向你致敬，普法尔茨选帝侯腓特烈五世。你的普法尔茨选帝侯领地被推向了一场伟大的宗教斗争的中心，成为神圣罗马帝国新教事业的主导力量。当叛乱的波希米亚阶级将王冠献给你时，你的大胆接受点燃了毁灭性的三十年战争。尽管你在布拉格的统治短暂得令人悲叹，为你赢得了“冬王”的不朽绰号，但你作为信仰的捍卫者和海德堡宏伟花园背后的远见卓识，将永远铭刻在欧洲历史的史册中。
Resolute Winter King, the time has come to secure a crown that will not melt away with the changing of the seasons. Can you protect the Palatinate from the ambitions of rival empires and guide your people through the bitter storms of war? Will your legacy be one of fleeting glory, or will you build a civilization that stands the test of time? = 坚决的冬王，是时候确保一顶不会随季节变化而消融的王冠了。你能保护普法尔茨免受敌对帝国野心的侵害，并引导你的人民度过残酷的战争风暴吗？你的遗产是转瞬即逝的荣耀，还是建立一个经得起时间考验的文明？
