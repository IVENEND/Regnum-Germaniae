Julius = 尤利乌斯
The stars have aligned against you, and so have my armies. By war, my realm shall be secured. = 星象已与你作对，我的军队也是。通过战争，我的王国将得到保障。
You dare strike at Wolfenbüttel? Every household in my realm is armed and trained. You will find no easy victory here. = 你竟敢攻击沃尔芬比特尔？我领地里的每家每户都经过武装和训练。你在这里找不到轻易的胜利。
My treasury is spent and my militia broken. I only pray my great libraries and universities survive your conquest. = 我的国库已空，民兵已被击溃。我只祈祷我伟大的图书馆和大学能在你的征服中幸存下来。
Even the heavens look upon you with disdain. I will not associate with such ignorance. = 连上天都鄙视你。我不会与这种无知为伍。
Welcome, traveler. I am Julius, Duke of Brunswick. May our meeting be as prosperous as the silver mines of the Harz. = 欢迎，旅行者。我是布伦瑞克公爵尤利乌斯。愿我们的会面像哈茨山的银矿一样繁荣。
I have prepared a ledger for your review. It would be highly beneficial to consider this exchange. = 我准备了一份账本供你审阅。考虑这次交换将是非常有益的。
What is it you seek? = 你在寻找什么？
My time is better spent studying the heavens. Speak quickly. = 我的时间更适合用来研究星空。快点说。
Schützenfest = 射击节
Honour to you, Julius, Duke of Brunswick-Lüneburg and Prince of Wolfenbüttel. Though once destined for a quiet clerical life, you rose to rule and ushered in an era of unprecedented prosperity for your lands. By embracing the Reformation and establishing the grand University of Helmstedt, you brought great enlightenment to your people. A true visionary of the early modern era, your mercantilist pursuits in the Harz mountains filled the state's coffers with silver and copper, while your deep fascination with the cosmos earned you the moniker of the Astrologer Prince. Your grand library and sweeping reforms laid the foundation for a cultured and deeply formidable state. = 向你致敬，尤利乌斯，布伦瑞克-吕讷堡公爵兼沃尔芬比特尔亲王。虽然你曾注定要过平静的神职生活，但你崛起成为统治者，并为你的人民开创了一个前所未有的繁荣时代。通过接受宗教改革并建立宏伟的黑尔姆施泰特大学，你为你的人民带来了极大的启蒙。作为早期现代一位真正的有远见者，你在哈茨山的重商主义追求让国家的金库装满了白银和黄铜，而你对宇宙的深深着迷为你赢得了“占星家亲王”的绰号。你宏大的图书馆和彻底的改革为一个有教养且极为强大的国家奠定了基础。
Astute Duke, the wealth of the Harz mountains and the wisdom of the Academia Julia lay at your disposal once more. Can you navigate the stars and fill your treasuries with the finest silver? Can you foster an enlightened realm where education, trade, and faith flourish in harmony? Can you build a civilization that will stand the test of time? = 精明的公爵，哈茨山的财富和尤利娅学院的智慧再次任你差遣。你能驾驭星辰，用最上等的白银填满你的国库吗？你能培育一个教育、贸易和信仰和谐繁荣的开明王国吗？你能建立一个经得起时间考验的文明吗？
