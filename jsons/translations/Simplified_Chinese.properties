Hail, great Bogislaw X, noble Duke of Pomerania! Pomerania has a long and fractured past, a crossroads of Germanic and Slavic cultures along the coast of the mighty Baltic Sea. Before you rose to power, the Duchy of Pomerania was fractured for centuries, a number of squabbling rulers torn and tossed between the spheres of Poland, Brandenburg and other powers in northern Europe. But under your wise rulership, Pomerania was united into one territory once more! Thanks to your wise diplomatic hand, your newly unified Duchy was able to assert itself as a state of its own, free of any hegemonic influence. It is of no question that you earned the moniker of Bogislaw the Great! = 向你致敬，伟大的波吉斯瓦夫十世，高贵的波美拉尼亚公爵！波美拉尼亚有着漫长而破碎的过去，是强大的波罗的海沿岸日耳曼和斯拉夫文化的十字路口。在你掌权之前，波美拉尼亚公国已经分裂了几个世纪，一些争吵不休的统治者在波兰、勃兰登堡和北欧其他势力的势力范围之间被撕扯和摆布。但在你英明的统治下，波美拉尼亚再次统一成一个领土！多亏了你明智的外交手段，你新统一的公国能够确立自己作为一个独立国家的地位，不受任何霸权势力的影响。毫无疑问，你赢得了伟大者波吉斯瓦夫的绰号！
Oh wise Duke, Pomerania would not stay united for long after your reign, and even today is fractured and split between the powers that always threatened its independence. But your people rejoice at your return! Will you restore the prestige of the House of Griffins? Will you build a civilization to stand the test of time? = 哦，睿智的公爵，波美拉尼亚在你的统治结束后不久就没有保持统一，甚至直到今天，它仍然破碎并分裂在那些总是威胁其独立的势力之间。但是你的人民为你的归来而欢欣鼓舞！你能恢复狮鹫家族的声望吗？你能建立一个经得起时间考验的文明吗？
