O beloved Christian, the Kingdoms of Denmark and Norway beckon the return of your rule to re-establish a powerful maritime empire. Can you heed the calling of the ancient crowns of Denmark and Norway? Can you, with good character, be the enlightened king that your people demand? Can you build a civilization that can stand the test of time? = 敬爱的克里斯蒂安，丹麦和挪威王国召唤你的回归，以重建强大的海洋帝国。你能倾听丹麦和挪威古老王冠的呼唤吗？你能以高尚的品格，成为你的人民所要求的开明君主吗？你能建立一个经得起时间考验的文明吗？  


