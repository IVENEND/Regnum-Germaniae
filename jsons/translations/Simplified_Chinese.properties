Hermann von Salza = 赫尔曼·冯·萨尔扎
The time for diplomacy has passed. By the cross we bear and the swords we wield, we march to war. = 外交的时间已经过去。凭借我们肩负的十字架和挥舞的利剑，我们走向战争。
You dare strike at the vanguard of faith? A grave error that my knights shall soon rectify. = 你竟敢攻击信仰的先锋？我的骑士们很快就会纠正这个严重的错误。
God's will be done. Though our chapter closes today, the legacy of the Order shall never be erased. = 上帝的旨意已经完成。虽然我们今天结束了这一篇章，但骑士团的遗产永远不会被抹去。
Your words are as empty as your faith. The Order stands resolute against such slander. = 你的话语就像你的信仰一样空洞。骑士团坚决反对这种诽谤。
Greetings. I am Hermann von Salza, Grand Master of the Teutonic Order. May our meeting be guided by wisdom and peace. = 你好。我是赫尔曼·冯·萨尔扎，条顿骑士团大团长。愿我们的会面在智慧与和平的指引下进行。
A proposal for our mutual benefit. I trust you will see its wisdom. = 一份对我们双方都有利的提案。我相信你会看到其中的智慧。
What news do you bring? = 你带来了什么消息？
Do not test my patience today. Speak swiftly. = 今天不要考验我的耐心。快点说。
Northern Crusade = 北方十字军
Hail, Hermann von Salza, Grand Master of the Teutonic Knights. Through your masterful diplomacy and unwavering devotion, you transformed a humble crusading brotherhood into a formidable military and monastic order. A trusted confidant to both Pope and Holy Roman Emperor, your grand vision brought the crusading spirit to the shores of the Baltic. With sword and cross, you laid the foundations of the Teutonic Order's state, carving out a disciplined realm in Prussia that would echo through the annals of history. = 向你致敬，赫尔曼·冯·萨尔扎，条顿骑士团大团长。通过你巧妙的外交和坚定不移的奉献，你将一个卑微的十字军兄弟会转变为一个强大的军事修会。作为教皇和神圣罗马皇帝信赖的知己，你的宏伟愿景将十字军精神带到了波罗的海沿岸。带着剑和十字架，你奠定了条顿骑士团国家的基础，在普鲁士开辟了一个纪律严明的国家，将在历史的长河中回荡。
Wise Grand Master, the northern frontiers call for your steadfast leadership once more. Can you marshal the brethren knights to bring order and faith to untamed lands? Will your diplomatic cunning secure the prosperity of your sovereign domain? Can you build a civilization that will stand the test of time? = 睿智的大团长，北部边疆再次呼唤你坚定的领导。你能集结骑士兄弟们，将秩序和信仰带到未开化的土地上吗？你的外交手腕能确保你主权领域的繁荣吗？你能建立一个经得起时间考验的文明吗？
