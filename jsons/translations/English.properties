 # Requires translation!
You have achieved what the boldest and most powerful men of the age could not. I would be awed, were I not so disgusted. = 
 # Requires translation!
Your ambitions are as transparent as they are tyrannical. I see through your lies, and the world shall know of them too. = 
 # Requires translation!
Well met, stranger! I am René II, and I rule these lands as their Duke. Let it be known that Lorraine has never been conquered, and has resisted foes far more fearsome than it! If you aim to conquer us, your armies will fall like the others. Feel free to try, though. I do enjoy a challenge. = 
