Vaclav II = 瓦茨拉夫二世
You have given me no other option. By war, I shall defend my peoples' freedoms. = 你沒有給我其他選擇。我將通過戰爭來捍衛我的人民的自由。
You are a coward to attack me so brazenly. = 你竟敢如此厚顏無恥地攻擊我，真是個懦夫。
You have defeated me now, but one day my people will carve out a new kingdom. = 你現在打敗了我，但總有一天我的人民會開闢出一個新的王國。
You are more of a fool than you look, then. = 那你比你看起來還要愚蠢。
I am Vaclav II, king of Bohemia. I am the ruler of the Lands of the Crown of Saint Wenceslas, and I bid you welcome. = 我是波希米亞國王瓦茨拉夫二世。我是聖溫塞斯拉斯王冠領地的統治者，我歡迎你的到來。
Yes? = 有事？
Speak if you must. = 如果一定要說就說吧。
The Hussite Wars = 胡斯戰爭
Hail the mighty King Vaclav II, ruler of the lands of the Crown of Saint Wenceslas. The Kingdom of Bohemia lies within the conclaves of European power, between the Holy Roman Empire in the west and the Kingdom of Poland in the east. An important elector to the Holy Roman Emperors and champion of the Hussite cause, Bohemian history espouses a nation of great and fierce pride, and serves as a reminder of the once noble Kingdom which lay at the crossroads of Europe's east and west. = 向強大的瓦茨拉夫二世國王致敬，聖溫塞斯拉斯王冠領地的統治者。波希米亞王國位於歐洲權力的中心，西鄰神聖羅馬帝國，東接波蘭王國。作為神聖羅馬皇帝的重要選帝侯和胡斯派事業的擁護者，波希米亞的歷史彰顯了一個擁有巨大而強烈自豪感的民族，並提醒人們這個曾經位於歐洲東西方十字路口的高貴王國。
Proud monarch, a resurgance of Czech identity has instilled in your people their desire for a sovereign nation once more. Can you restore the Crown Lands of Bohemia? Where once rose great castles and Kings of great character, can you once again bring pride to the Bohemian homelands? Can you build a civilization to stand the test of time? = 驕傲的君主，捷克認同感的復甦再次向你的人民灌輸了對主權國家的渴望。你能恢復波希米亞的王冠領地嗎？在曾經聳立著宏偉城堡和偉大國王的地方，你能再次為波希米亞的家園帶來驕傲嗎？你能建立一個經得起時間考驗的文明嗎？
