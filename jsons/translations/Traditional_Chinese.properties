Greetings, wise ruler! I am Bogislaw X, the first to unite the whole of Pomerania in centuries. Some call me 'the Great' - perhaps you will soon be one of them? = 你好，睿智的統治者！我是波吉斯瓦夫十世，幾個世紀以來第一位統一整個波美拉尼亞的人。有些人稱我為“偉大者”——也許你很快就會成為他們中的一員？
A prosperous exchange on the Baltic benefits us both. I ask that you consider this offer. = 波羅的海上繁榮的交流對我們雙方都有利。我要求你考慮這個提議。
What news do you bring to my court? = 你給我的宮廷帶來了什麼消息？
State your business, and make it brief. = 說明你的來意，盡量簡短。
