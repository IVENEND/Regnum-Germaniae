Julius Echter von Mespelbrunn = 尤利烏斯·埃希特·馮·梅斯佩爾布倫
The wicked must be cleansed from this earth. I bring the sword of divine justice to your very gates. = 邪惡之人必須從地球上被清除。我將神聖正義之劍帶到你的城門前。
You dare strike at the Lord's chosen shepherd? My faith is an absolute fortress, and your armies shall break upon its walls. = 你竟敢攻擊主選定的牧羊人？我的信仰是一座絕對的堡壘，你的軍隊將在它的城牆上粉碎。
The Lord tests his faithful in mysterious ways. Though my earthly realm falls to ruin, the spiritual foundations I have laid shall never crumble. = 主以神秘的方式考驗他的信徒。雖然我的塵世領域歸於毀滅，但我奠定的精神基礎永遠不會崩潰。
Your words are the babble of the faithless. I shall pray for your swift and righteous judgment. = 你的話是背信棄義者的胡言亂語。我將為你迅速而公正的審判祈禱。
God's blessings upon you, traveler. I am Julius Echter, Prince-Bishop of Würzburg. Step into the light of our faith and speak your purpose. = 願上帝保佑你，旅行者。我是維爾茨堡的親王主教尤利烏斯·埃希特。步入我們信仰的光芒之中，說出你的目的。
A proposal of worldly goods. Review it with a careful and righteous mind. = 一份關於世俗物資的提案。以謹慎和正直的心去審視它。
May the Lord guide our words. = 願主引導我們的言辭。
Do not test my patience, lest you find my mercy lacking. = 不要考驗我的耐心，免得你發現我缺乏仁慈。
A Rugged Land of Fortresses = 崎嶇要塞之國
Greetings to you, Julius Echter von Mespelbrunn, devoted Prince-Bishop of Würzburg. As a resolute pillar of the Holy Roman Empire, you guided your bishopric through a turbulent era of religious strife, standing as a fierce champion of the Counter-Reformation. Your legacy is not only one of unyielding spiritual fervor, but of magnificent creation. From the distinctive towering spires of your countless churches to the establishment of the great University and the Juliusspital, your tireless ambition transformed Würzburg into a true bastion of faith, education, and architectural splendor. = 向你致敬，尤利烏斯·埃希特·馮·梅斯佩爾布倫，忠誠的維爾茨堡親王主教。作為神聖羅馬帝國堅定的支柱，你帶領你的教區度過了宗教衝突的動蕩時代，作為反宗教改革的激烈擁護者而屹立不倒。你的遺產不僅是不屈的宗教狂熱，還有宏偉的創造。從你無數教堂獨特的聳立尖頂，到建立偉大的大學和尤利烏斯醫院，你不知疲倦的雄心將維爾茨堡變成了一個真正的信仰、教育和建築輝煌的堡壘。
Zealous shepherd of your flock, the grand halls of Marienberg Fortress await your divine mandate once more. Can you foster a realm of unrivaled devotion and enlightenment? Can you shield your lands from heresy and guide your people to salvation through faith and monumental works? Can you build a civilization that will stand the test of time? = 狂熱的牧羊人，瑪利恩堡要塞的大廳再次等待著你的神聖使命。你能培育一個擁有無與倫比的奉獻精神和開明思想的國度嗎？你能保護你的土地免受異端邪說的侵害，並通過信仰和不朽的作品引導你的人民獲得拯救嗎？你能建立一個經得起時間考驗的文明嗎？
