An Army with a State = 擁有國家的軍隊
Honour to you, O' brilliant and tactful Frederick the Great. You are the King of Prussia, a state conceived in piety and bloodshed; elevated to the heights of power by her exceptional skill on the battlefield. Celebrated for your military genius and your enlightened ideals, your victories against Austria and Poland would be your defining legacy, ensuring for Prussia not only a place amongst the great powers of Europe but also amongst military minds to come. = 向你致敬，才華橫溢、機智果敢的腓特烈大帝。你是普魯士國王，這是一個在虔誠與流血中孕育的國家；憑藉在戰場上的非凡技藝登上了權力的巔峰。你以軍事天才和開明的理想而聞名，你對奧地利和波蘭的勝利將成為你決定性的遺產，這不僅確保了普魯士在歐洲列強中的地位，也確保了在未來軍事思想中的地位。
Most enlightened King, Prussia's military glory once more awaits. Can you march her soldiers into battle and return triumphant against all manner of foe? Can you make Prussia a bastion of free and effective government? Can you build a civilization that will stand the test of time? = 最開明的國王，普魯士的軍事榮耀再次等待著你。你能率領她的士兵參加戰鬥並在對抗各種敵人後凱旋而歸嗎？你能讓普魯士成為自由和高效政府的堡壘嗎？你能建立一個經得起時間考驗的文明嗎？
