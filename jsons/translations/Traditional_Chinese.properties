Hail, great Bogislaw X, noble Duke of Pomerania! Pomerania has a long and fractured past, a crossroads of Germanic and Slavic cultures along the coast of the mighty Baltic Sea. Before you rose to power, the Duchy of Pomerania was fractured for centuries, a number of squabbling rulers torn and tossed between the spheres of Poland, Brandenburg and other powers in northern Europe. But under your wise rulership, Pomerania was united into one territory once more! Thanks to your wise diplomatic hand, your newly unified Duchy was able to assert itself as a state of its own, free of any hegemonic influence. It is of no question that you earned the moniker of Bogislaw the Great! = 向你致敬，偉大的波吉斯瓦夫十世，高貴的波美拉尼亞公爵！波美拉尼亞有著漫長而破碎的過去，是強大的波羅的海沿岸日耳曼和斯拉夫文化的十字路口。在你掌權之前，波美拉尼亞公國已經分裂了幾個世紀，一些爭吵不休的統治者在波蘭、勃蘭登堡和北歐其他勢力的勢力範圍之間被撕扯和擺布。但在你英明的統治下，波美拉尼亞再次統一成一個領土！多虧了你明智的外交手段，你新統一的公國能夠確立自己作為一個獨立國家的地位，不受任何霸權勢力的影響。毫無疑問，你贏得了偉大者波吉斯瓦夫的綽號！
Oh wise Duke, Pomerania would not stay united for long after your reign, and even today is fractured and split between the powers that always threatened its independence. But your people rejoice at your return! Will you restore the prestige of the House of Griffins? Will you build a civilization to stand the test of time? = 哦，睿智的公爵，波美拉尼亞在你的統治結束後不久就沒有保持統一，甚至直到今天，它仍然破碎並分裂在那些總是威脅其獨立的勢力之間。但是你的人民為你的歸來而歡欣鼓舞！你能恢復獅鷲家族的聲望嗎？你能建立一個經得起時間考驗的文明嗎？
