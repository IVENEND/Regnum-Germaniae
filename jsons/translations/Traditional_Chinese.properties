*takes his crossbow and shoots at you* = *拿起他的十字弩朝你射擊*
Hail and honour to you, friend. I am Wilhelm Tell, hero of the simple folk and saviour of its freedom. = 朋友，向你致敬。我是威廉·退爾，平民的英雄和他們自由的拯救者。
The Old Swiss Confederacy = 舊瑞士邦聯
Let the overtures tell of your great deeds, oh Wilhelm Tell, first Eidgenosse, folk legend, expert marksman, and he whose defiance and tyrannicide set the people of the old Swiss Confederacy free. The legends say you were born in Bürglen, Uri. Growing up to become a strong man, you grew to become disillusioned with the Habsburg emperors of Austria attempted domination of Uri and vowed to act. Becoming one of the conspirators of Werner Stauffacher, you resisted the Austrian Vogt of Altdorf, Albrecht Gessler. On your journey to the eventual assassination of Gessler, you partook in misadventures, including your famous splitting of the apple on your son’s head by a shot from your crossbow, your imprisonment, and escape from the Tellsplatte. Your assassination of Gessler led to a rebellion, which led to the formation of the Old Swiss Confederacy. Brave to the end, legend says you continued to fight the Austrians, and died trying to save a child from drowning.  = 讓序曲講述你的豐功偉績吧，哦，威廉·退爾，第一位瑞士盟約者，民間傳奇，神射手，他反抗和弒暴君的行為使舊瑞士邦聯的人民獲得了自由。傳說你出生在烏里的比格倫。長大成為一個強壯的人後，你對奧地利哈布斯堡皇帝試圖統治烏里感到幻滅，並誓言採取行動。成為維爾納·斯陶法赫的同謀之一後，你反抗了奧地利的阿爾特多夫總督阿爾布雷希特·格斯勒。在最終刺殺格斯勒的旅程中，你經歷了許多冒險，包括用十字弩射中兒子頭上的蘋果的著名事件，你的被捕，以及從泰爾石板的逃脫。你刺殺格斯勒引發了叛亂，這導致了舊瑞士邦聯的形成。傳說中你勇敢到最後一刻，繼續與奧地利人作戰，並在試圖救一名溺水兒童時喪生。
Oh Wilhelm Tell, your people once again crave the daring, bravery and strength. You must awaken from your cave at the Rigi. But beware, the world has changed; new challenges must be conquered, and if you are to live up to your legend, you must once again rise to fight those who would seek to destroy you. Can you live up to the expectations of your people? Can you build a civilization that will stand the test of time? = 哦，威廉·退爾，你的人民再次渴望你的膽識、勇敢和力量。你必須從瑞吉山的洞穴中醒來。但要小心，世界已經改變；必須征服新的挑戰，如果你想不負你的傳奇，你必須再次站起來，與那些試圖摧毀你的人戰鬥。你能不辜負人民的期望嗎？你能建立一個經得起時間考驗的文明嗎？
