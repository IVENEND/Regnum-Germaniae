Elector Frederick V = 選帝侯腓特烈五世
The storm gathers once more over our lands. May the Almighty judge the righteousness of our cause as we march to war. = 風暴再次在我們的土地上空聚集。當我們走向戰爭時，願萬能的主評判我們事業的正義性。
You seek to usurp my rightful domain? I assure you, I shall not be driven into exile so easily this time. = 你想篡奪我合法的領地？我向你保證，這次我不會這麼輕易被流放。
It seems the winter of my reign has come at last. The crown slips from my grasp, and I am cast into the cold once more. = 看來我統治的冬天終於到來了。王冠從我手中滑落，我再次被投入嚴寒之中。
Your slander is nothing but the desperate rambling of a false claimant. = 你的誹謗只不過是一個虛假索賠者的絕望胡言亂語。
Greetings to you. I am Frederick V, Elector Palatine and rightful King of Bohemia. Let us speak of diplomacy and peace, while we still can. = 你們好。我是普法爾茨選帝侯、波希米亞合法國王腓特烈五世。讓我們趁還有機會的時候談談外交與和平吧。
I bring a proposal of trade. Let us see if our interests align. = 我帶來了一份貿易提案。讓我們看看我們的利益是否一致。
I am listening. = 我在聽。
State your business quickly, for the shadows grow long. = 快點說明你的來意，因為陰影正在拉長。
Palatinate Tolerance = 宗教寬容
Honour to you, Elector Frederick V of the Palatinate. Thrust into the center of a great religious struggle, your realm of the Electoral Palatinate stood as a leading voice for the Protestant cause in the Holy Roman Empire. When the rebellious estates of Bohemia offered you their crown, your bold acceptance ignited the devastating Thirty Years' War. Though your reign in Prague was tragically brief, earning you the immortal moniker of the 'Winter King', your legacy as a champion of your faith and the visionary behind Heidelberg's magnificent gardens remains forever etched in the annals of European history. = 向你致敬，普法爾茨選帝侯腓特烈五世。你的普法爾茨選帝侯領地被推向了一場偉大的宗教鬥爭的中心，成為神聖羅馬帝國新教事業的主導力量。當叛亂的波希米亞階級將王冠獻給你時，你的大膽接受點燃了毀滅性的三十年戰爭。儘管你在布拉格的統治短暫得令人悲嘆，為你贏得了“冬王”的不朽綽號，但你作為信仰的捍衛者和海德堡宏偉花園背後的遠見卓識，將永遠銘刻在歐洲歷史的史冊中。
Resolute Winter King, the time has come to secure a crown that will not melt away with the changing of the seasons. Can you protect the Palatinate from the ambitions of rival empires and guide your people through the bitter storms of war? Will your legacy be one of fleeting glory, or will you build a civilization that stands the test of time? = 堅決的冬王，是時候確保一頂不會隨季節變化而消融的王冠了。你能保護普法爾茨免受敵對帝國野心的侵害，並引導你的人民度過殘酷的戰爭風暴嗎？你的遺產是轉瞬即逝的榮耀，還是建立一個經得起時間考驗的文明？
