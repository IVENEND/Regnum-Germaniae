Ferdinand I = 斐迪南一世
Austro = 奧地利的  
Diplomacy has reached its bitter end. I am left with no choice but to bring the full might of the Empire against you. = 外交已到了盡頭。我別無選擇，只能動用帝國的全部力量來對付你。
You strike at the very heart of the Empire! A grave mistake, for the House of Habsburg does not easily yield. = 你竟敢攻擊帝國的心臟！這是一個嚴重的錯誤，因為哈布斯堡家族絕不輕易屈服。
Alas, I must submit to your triumph over me, and bid you congratulations, farewell, and the burden of my imperial throne. = 唉，我必須屈服於你對我的勝利，向你道賀、告別，並將我帝國王座的重擔交予你。
Your words are as hollow as your honor. The Empire shall not easily forget this insult. = 你的話語就如你的榮譽一般空洞。帝國不會輕易忘記這種侮辱。
Ah, welcome. I didn't see you there at first. I am Ferdinand I, Holy Roman Emperor and King in Germany, King of Hungary, Bohemia, Dalmatia, Croatia, Archduke of Austria, Duke of Burgundy, Margrave of Moravia, and... well, you get the idea. Oh, and King of Slavonia, too. = 啊，歡迎。我起初沒看到你。我是斐迪南一世，神聖羅馬帝國皇帝、德意志國王，匈牙利、波希米亞、達爾馬提亞、克羅地亞國王，奧地利大公，勃艮第公爵，摩拉維亞藩侯，還有……嗯，你懂的。哦，還有斯拉沃尼亞國王。
A prosperous empire is built upon mutual gain. I trust you will find this proposal agreeable. = 繁榮的帝國建立在互利互惠的基礎上。我相信你會同意這個提議的。
Speak your matter. = 說出你的來意。
Your presence is a foul thing. = 你的出現真是令人作嘔。
Honour to you, O' steadfast Ferdinand I, Archduke of Austria and Holy Roman Emperor. You stand as the great bastion of Christendom, having defended the gates of Vienna against the encroaching Ottoman tide. Inheriting a vast and diverse realm from your brother, Charles V, your reign was defined by both military resilience and diplomatic pragmatism. Through the Peace of Augsburg, you brought a measure of stability to a fractured empire, proving that the strength of the Habsburgs lies not only in the sword, but in compromise and unity. = 向你致敬，堅定的奧地利大公兼神聖羅馬帝國皇帝，斐迪南一世。你作為基督教世界的偉大堡壘，在維也納城門前抵擋了奧斯曼帝國的入侵狂潮。你從你的兄長查理五世那裡繼承了一個廣闊而多樣的領土，你的統治時期以軍事韌性和外交實用主義為標誌。透過《奧格斯堡和約》，你為分裂的帝國帶來了一定程度的穩定，證明了哈布斯堡家族的力量不僅在於利劍，更在於妥協與團結。
Pragmatic Emperor, the many crowns of your sprawling dominion look to you for guidance once more. Can you safeguard your borders against those who would see your realm fall? Can you bring harmony to an empire divided by faith and ambition? Can you build a civilization that will stand the test of time? = 務實的皇帝，你廣闊領土上的眾多王冠再次向你尋求指引。你能否保護你的邊疆，抵禦那些妄圖顛覆你王國的敵人？你能否為這個被信仰和野心分裂的帝國帶來和諧？你能建立一個經得起時間考驗的文明嗎？


James VI = 詹姆斯六世
By the will of God, I continue this quest to bring His word to your lands. For you could not see reason, it must be by war. = 奉上帝之意，我繼續執行將他的福音帶到你們土地上的使命。既然你們不講道理，那就只能訴諸戰爭。
God hath christened my right to this throne, and for so long as I live you shall not take it from me. = 上帝賜予了我繼承這個王位的權利，只要我還活著，你們就休想把它奪走。
You dealt this great kingdom a mighty blow, and I go now in despair. = 你給了這個偉大的王國沉重的一擊，我現在在絕望中離去。
God will not tolerate his act of indecency. = 上帝不會容忍他的無禮行為。
I am James VI, christened as by God king of Scotland. I am a staunch believer in my divine right to serve as both judge and judged on behalf of my people, before God. Can you say the same? = 我是詹姆斯六世，蒙上帝恩典成為蘇格蘭國王。我堅信我的君權神授，代表我的人民在上帝面前行使評判與被評判的權利。你也能這麼說嗎？
You wish to speak? Then do so. = 你想說話？那就說吧。
I have little time for heathens and heretics. Make it quick. = 我沒時間理會異教徒和異端。有話快說。
Last of the Free = 最後的自由者
God hath christened this day, O' wise and devoted King James of Scotland, England, and Ireland. Barely a child at the age of your ascension, you would come to inherit the thrones of the three ancient and noble Kingdoms of the British Isles. With your mind set to what makes for a righteous monarch, your reign would bring forward an age of great innovation and the beginnings of a colonial empire. A patron of the arts and sciences, as well as a devoted servant to God and realm, your reign would author the greatest testimony to the strength of the kinship of all Britons, and stands as a legacy of a realm united in the quest for glory and harmony. = 上帝保佑今天，智慧而虔誠的蘇格蘭、英格蘭和愛爾蘭國王詹姆斯。你在繼位時還是個孩子，但你繼承了不列顛群島三個古老而高貴王國的王位。你決心成為一名正義的君主，你的統治帶來了一個偉大的創新時代和一個殖民帝國的開端。作為藝術和科學的贊助人，以及上帝和王國的忠誠公僕，你的統治是所有英國人血脈力量的最偉大證明，也是一個為了榮耀與和諧而團結的王國的遺產。
By God's will, your throne stands alone between harmony and disunity. Can you behold the pursuit of knowledge and keep in your heart devotion to God and people? Can you usher in a new golden age of culture and knowledge? Can you build a civilization that can stand the test of time? = 憑著上帝的意志，你的王位在和諧與分裂之間巍然屹立。你能否繼續追求知識，並在心中保持對上帝和人民的奉獻？你能開啟文化和知識的新黃金時代嗎？你能建立一個經得起時間考驗的文明嗎？
