Hermann von Salza = 赫爾曼·馮·薩爾扎
The time for diplomacy has passed. By the cross we bear and the swords we wield, we march to war. = 外交的時間已經過去。憑藉我們肩負的十字架和揮舞的利劍，我們走向戰爭。
You dare strike at the vanguard of faith? A grave error that my knights shall soon rectify. = 你竟敢攻擊信仰的先鋒？我的騎士們很快就會糾正這個嚴重的錯誤。
God's will be done. Though our chapter closes today, the legacy of the Order shall never be erased. = 上帝的旨意已經完成。雖然我們今天結束了這一篇章，但騎士團的遺產永遠不會被抹去。
Your words are as empty as your faith. The Order stands resolute against such slander. = 你的話語就像你的信仰一樣空洞。騎士團堅決反對這種誹謗。
Greetings. I am Hermann von Salza, Grand Master of the Teutonic Order. May our meeting be guided by wisdom and peace. = 你好。我是赫爾曼·馮·薩爾扎，條頓騎士團大團長。願我們的會面在智慧與和平的指引下進行。
A proposal for our mutual benefit. I trust you will see its wisdom. = 一份對我們雙方都有利的提案。我相信你會看到其中的智慧。
What news do you bring? = 你帶來了什麼消息？
Do not test my patience today. Speak swiftly. = 今天不要考驗我的耐心。快點說。
Northern Crusade = 北方十字軍
Hail, Hermann von Salza, Grand Master of the Teutonic Knights. Through your masterful diplomacy and unwavering devotion, you transformed a humble crusading brotherhood into a formidable military and monastic order. A trusted confidant to both Pope and Holy Roman Emperor, your grand vision brought the crusading spirit to the shores of the Baltic. With sword and cross, you laid the foundations of the Teutonic Order's state, carving out a disciplined realm in Prussia that would echo through the annals of history. = 向你致敬，赫爾曼·馮·薩爾扎，條頓騎士團大團長。通過你巧妙的外交和堅定不移的奉獻，你將一個卑微的十字軍兄弟會轉變為一個強大的軍事修會。作為教皇和神聖羅馬皇帝信賴的知己，你的宏偉願景將十字軍精神帶到了波羅的海沿岸。帶著劍和十字架，你奠定了條顿騎士團國家的基礎，在普魯士開闢了一個紀律嚴明的國家，將在歷史的長河中回蕩。
Wise Grand Master, the northern frontiers call for your steadfast leadership once more. Can you marshal the brethren knights to bring order and faith to untamed lands? Will your diplomatic cunning secure the prosperity of your sovereign domain? Can you build a civilization that will stand the test of time? = 睿智的大團長，北部邊疆再次呼喚你堅定的領導。你能集結騎士兄弟們，將秩序和信仰帶到未開化的土地上嗎？你的外交手腕能確保你主權領域的繁榮嗎？你能建立一個經得起時間考驗的文明嗎？
