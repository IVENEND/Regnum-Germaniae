René II = 勒內二世
You have achieved what the boldest and most powerful men of the age could not. I would be awed, were I not so disgusted. = 你做到了這個時代最大膽、最有權勢的人都做不到的事情。如果不是如此厭惡，我本會感到敬畏的。
Your ambitions are as transparent as they are tyrannical. I see through your lies, and the world shall know of them too. = 你的野心顯露無疑，就像你的暴政一樣。我看穿了你的謊言，世界也會知道的。
Well met, stranger! I am René II, and I rule these lands as their Duke. Let it be known that Lorraine has never been conquered, and has resisted foes far more fearsome than it! If you aim to conquer us, your armies will fall like the others. Feel free to try, though. I do enjoy a challenge. = 幸會，陌生人！我是勒內二世，我作為公爵統治著這些土地。你要知道，洛林從未被征服過，並且抵抗過比它可怕得多的敵人！如果你想征服我們，你的軍隊會像其他人一樣倒下。不過你可以盡情嘗試。我確實喜歡挑戰。
I bring a proposal that would benefit our realms. I suggest you look it over carefully. = 我帶來了一份有益於我們領地的提案。我建議你仔細看看。
Speak your mind. = 說出你的想法。
Make it quick. My patience for you wears thin. = 快點。我對你的耐心越來越少了。
Legacy of Lotharingia = 洛塔林吉亞的遺產
We salute you, René II, most valiant of princes, Hercules of our times, who dared challenge the Lion to combat! You rule as Duke of Lorraine, the heir to the old kingdom of Lotharingia, a land both in France and in the Holy Roman Empire. Your duchy is a bountiful and fertile one, but even more so than that, a fiercely independent one. Lorraine was never conquered, only inherited. And what better symbol of Lorrainian resilience is there than you, great René? As a young duke, your domain was threatened by the powerful and ambitious Charles the Bold of Burgundy, who swept into your proud duchy with a seemingly insurmountable modern army. Unbowed and undeterred, you and your allies struck back against the Burgundians, routing their armies at the gates of Nancy and slaying Lorraine's would-be conqueror! Your heroic deeds will live on forever, in history and in poetry. = 向你致敬，勒內二世，最英勇的親王，我們時代的赫拉克勒斯，敢於挑戰雄獅的戰士！你統治著洛林公國，這是古老洛塔林吉亞王國的繼承者，一塊橫跨法國和神聖羅馬帝國的土地。你的公國富饒而肥沃，但更重要的是，它極度獨立。洛林從未被征服過，只能被繼承。還有什麼比你，偉大的勒內，更能代表洛林的韌性呢？作為一名年輕的公爵，你的領地受到強大而野心勃勃的勃艮第大膽查理的威脅，他帶著一支看似不可戰勝的現代軍隊席捲了你驕傲的公國。你和你的盟友不屈不撓，向勃艮第人發起反擊，在南錫城門外擊潰了他們的軍隊，殺死了洛林的潛在征服者！你的英雄事蹟將永遠活在歷史和詩歌中。
Valiant René, the people of Lorraine once more call out for a tenacious hand to see them through the tribulations that lie ahead. Will you once more defend your duchy, and bring it into a new age of prestige and prosperity? Will you build a civilization that can stand the test of time? = 英勇的勒內，洛林人民再次呼喚一雙堅韌的手來幫助他們度過未來的磨難。你會再次保衛你的公國，並帶領它進入一個聲望與繁榮的新時代嗎？你能建立一個經得起時間考驗的文明嗎？
