God is with you. Did you come to learn of our Lords teachings, heathen? I am Albert of Livonia, who shall bring faith to this land. = 上帝與你同在。你是來學習我們主的教義的嗎，異教徒？我是利沃尼亞的阿爾布雷希，將把信仰帶到這片土地上的人。
