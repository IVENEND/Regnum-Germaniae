Greetings and welcome, I am Mayor Jürgen Wullenwever. Care to share some beer while discussing future trade deals?  = 您好，歡迎您的到來。我是市長于爾根·烏倫韋弗。有興趣一邊喝啤酒一邊討論未來的貿易協議嗎？
Honour and Credibility, Jürgen Wullenwever, Mayor of Lübeck and Leader of the mighty Hanseatic League. When you rose to power to secure the rights of the rising bourgeois class in the free northern cities in Germany, during the Age of Reformation, the Golden Age of Trade within the Baltics are already on its downfall. But It were you trying to rekindle the wind in the sails of the hanseatic cogs to remember the olden days when it dominated not only the Baltics, but also the North Sea in trade from London to Novgorod, from Oslo to Venice. In the end you lost the initiated Counts Feud, but your name still lives on in the rank of a folk hero. = 榮譽與信用，于爾根·烏倫韋弗，呂貝克市長兼強大的漢薩同盟領袖。在宗教改革時代，當您為了保障德國北部自由城市中崛起的資產階級的權利而掌權時，波羅的海的貿易黃金時代已然衰落。但是，正是您試圖重振漢薩柯克船的風帆，以緬懷那個不僅在波羅的海，而且在北海的貿易中（從倫敦到諾夫哥羅德，從奧斯陸到威尼斯）都佔據主導地位的昔日輝煌。最終您在挑起的伯爵戰爭中敗北，但您的名字依然作為民族英雄被銘記。
Brave Jürgen Wullenwever, the folk is electing you again as the Mayor of Lübeck to bring back once held glory. Will you seek out best trade agreements and lucrative opportunities once again? Will you build a civilization that can stand the test of time? = 勇敢的于爾根·烏倫韋弗，人民再次選舉您為呂貝克市長，以期恢復昔日的榮光。您會再次尋求最佳的貿易協議和利潤豐厚的機會嗎？您將建立一個經得起時間考驗的文明嗎？
