Make it brief. My patience for you wears thin. = 簡短點。我對你的耐心快要耗盡了。
Hessian Mercenary = 黑森傭兵
Hail to you, Philip the Magnanimous, Landgrave of Hesse and stalwart champion of the Protestant Reformation. Elevated by your unwavering conviction, you stood defiant against the might of the Holy Roman Emperor to protect the reformed faith. Through the Marburg Colloquy, you sought to unite the great theological minds of your age, and as a founding leader of the Schmalkaldic League, you forged a mighty alliance to defend the religious liberties of the German princes. Your legacy is one of fierce independence and religious zeal, forever etching Hesse into the annals of history. = 向你致敬，寬宏者腓力，黑森領地伯爵，新教改革的堅強捍衛者。在你不動搖的信念驅使下，你公然反抗神聖羅馬皇帝的權威以保護改革後的信仰。通過馬爾堡宗教會議，你試圖團結你那個時代偉大的神學思想家，作為施馬爾卡爾登聯盟的創始領導人，你建立了一個強大的聯盟來捍衛德意志諸侯的宗教自由。你的遺產是強烈的獨立和宗教熱情，將黑森永遠銘刻在歷史的史冊中。
Most magnanimous Landgrave, the faithful look to you once more for guidance and protection. Can you unite the fractured realms and stand strong against imperial tyranny? Can you ensure that the light of your reforms burns bright across the ages? Can you build a civilization that will stand the test of time? = 最寬宏的領地伯爵，信徒們再次向你尋求指導和保護。你能團結支離破碎的領域，堅決對抗帝國的暴政嗎？你能確保你的改革之光照耀千古嗎？你能建立一個經得起時間考驗的文明嗎？
