Welcome, Frederick Augustus I, elector of Saxony. You lead one of the cultural centres of Europe. Saxony is a modest country, with a wealth of art and architecture to its name. Elector to the Holy Roman Empire, Saxony rose to prominence during the 16th century, as home to the Protestant Reformation. In the 17th century, you joined Saxony in union with the Commonwealth of Poland-Lithuania, and embarked upon great projects which would make Dresden the envy of artists the world over. Even today, the legacy of your endeavours persist, and Saxony remains one of the most culturally autonomous states in Germany. = 歡迎你，薩克森選帝侯腓特烈·奧古斯特一世。你領導著歐洲的文化中心之一。薩克森是一個不起眼的國家，卻擁有豐富的藝術和建築財富。作為神聖羅馬帝國的選帝侯，薩克森在16世紀崛起，成為新教改革的發源地。在17世紀，你促成了薩克森與波蘭-立陶宛聯邦的聯合，並著手進行偉大的工程，使德累斯頓成為全世界藝術家羨慕的對象。即使在今天，你的努力留下的遺產依然存在，薩克森仍然是德意志最具文化自治性的邦國之一。
Strong and noble king, the great halls of Dresden's Palaces thirst for culture and enlightenment. Can you fill your cities with great works and monuments? Can you defend her sovereign territory and usher in a new golden age? Can you build a civilization that can stand the test of time? = 強大而高貴的國王，德累斯頓宮殿的宏偉殿堂渴望文化和啟蒙。你能用偉大的作品和紀念碑填滿你的城市嗎？你能保衛她的主權領土並迎來一個新的黃金時代嗎？你能建立一個經得起時間考驗的文明嗎？
