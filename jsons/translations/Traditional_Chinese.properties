Matthias Corvinus = 馬加什·科努維斯
Your insolence has provoked this war, and I shall be happy to lead the Black Army to victory over you. = 你的傲慢引發了這場戰爭，我將很樂意帶領黑軍擊敗你，贏得勝利。
Surely you had to know that one day there would be war between us. = 你肯定知道總有一天我們之間會有一戰。
Today you wear the victor's laurels, but can you keep what you have taken? = 今天你戴著勝利者的桂冠，但你能保住你所奪走的東西嗎？
The harsh judgments of the ignorant carry no weight in my court. = 無知者苛刻的評判在我的宮廷裡毫無分量。
I am Matthias. I am King of Hungary, scourge of my foes, and defender of the faithful. Greetings. = 我是馬加什。我是匈牙利國王，敵人的剋星，信徒的守護者。向你致敬。
A fair exchange benefits both our realms. Review these terms. = 公平的交換對我們兩方都有利。審閱這些條款吧。
Hussar Tradition = 驃騎兵傳統
Hail to you, O' noble Matthias Corvinus, King of Hungary and Croatia. Rising to the throne amidst the turmoil of Europe, you forged a mighty realm renowned for both its martial prowess and its dazzling intellect. Your legendary Black Army stood as an unyielding bulwark against the Ottoman advance and secured your conquests in Bohemia and Austria. Yet, you were not merely a conqueror; as a true champion of the Renaissance, your grand court at Buda and the magnificent Bibliotheca Corviniana attracted scholars and artists from across the known world, cementing Hungary's legacy as a beacon of culture and strength. = 向你致敬，高貴的馬加什·科努維斯，匈牙利和克羅地亞國王。在歐洲動蕩中登上王位，你建立了一個以軍事實力和耀眼智慧而聞名的強大國家。你傳奇的黑軍成為了對抗奧斯曼帝國進攻的不屈堡壘，並確保了你在波希米亞和奧地利的征服。然而，你不僅僅是一個征服者；作為真正的文藝復興擁護者，你在布達的宏偉宮廷和壯麗的科維尼亞納圖書館吸引了來自已知世界的學者和藝術家，鞏固了匈牙利作為文化和力量燈塔的遺產。
Mighty Matthias, your feats at arms are matched only by the depths of your knowledge. Let your mighty Black Army serve as your strong hand in the battlefield, both as sword against your enemies and as shield protecting your faithful people, and ages to come will utter your name in awe. = 强大的馬加什，你在軍事上的壯舉只有你知識的深度可以媲美。讓你强大的黑軍作為你在戰場上的強力手腕，既作為對抗敵人的劍，也作為保護你忠實人民的盾，後世將懷著敬畏說出你的名字。
