Albert of Buxhoeveden, God's blessing is with you and your ambitions. As the Livonian Chronicles are telling it to this day, you were the noble founder of Riga, once you called for a perpetual crusade against the heathens at the baltic shores to avenge your fallen brother in faith, who was Bishop before. But it was you o' brave Albert, who rose to Arch Bishop and even Prince-Bishop in the Reich with your glory that was in the conquest of the Land of Mary, founding Riga and securing it with the Order of the Sword Brethren. = 阿爾布雷希·馮·布克斯霍夫登，上帝的祝福與你和你的雄心同在。正如今天的《利沃尼亞編年史》所說，你是里加的高貴締造者，你曾呼籲對波羅的海沿岸的異教徒發動永久十字軍東征，為你曾擔任主教的陣亡信仰兄弟復仇。但正是你，勇敢的阿爾布雷希，憑藉征服瑪利亞之國的榮耀晉升為大主教，甚至成為帝國的親王主教，建立了里加，並用寶劍騎士團保衛它。
