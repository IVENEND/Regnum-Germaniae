Julius = 尤利烏斯
The stars have aligned against you, and so have my armies. By war, my realm shall be secured. = 星象已與你作對，我的軍隊也是。通過戰爭，我的王國將得到保障。
You dare strike at Wolfenbüttel? Every household in my realm is armed and trained. You will find no easy victory here. = 你竟敢攻擊沃爾芬比特爾？我領地裡的每家每戶都經過武裝和訓練。你在這裡找不到輕易的勝利。
My treasury is spent and my militia broken. I only pray my great libraries and universities survive your conquest. = 我的國庫已空，民兵已被擊潰。我只祈禱我偉大的圖書館和大學能在你的征服中倖存下來。
Even the heavens look upon you with disdain. I will not associate with such ignorance. = 連上天都鄙視你。我不會與這種無知為伍。
Welcome, traveler. I am Julius, Duke of Brunswick. May our meeting be as prosperous as the silver mines of the Harz. = 歡迎，旅行者。我是布倫瑞克公爵尤利烏斯。願我們的會面像哈茨山的銀礦一樣繁榮。
I have prepared a ledger for your review. It would be highly beneficial to consider this exchange. = 我準備了一份賬本供你審閱。考慮這次交換將是非常有益的。
What is it you seek? = 你在尋找什麼？
My time is better spent studying the heavens. Speak quickly. = 我的時間更適合用來研究星空。快點說。
Schützenfest = 射擊節
Honour to you, Julius, Duke of Brunswick-Lüneburg and Prince of Wolfenbüttel. Though once destined for a quiet clerical life, you rose to rule and ushered in an era of unprecedented prosperity for your lands. By embracing the Reformation and establishing the grand University of Helmstedt, you brought great enlightenment to your people. A true visionary of the early modern era, your mercantilist pursuits in the Harz mountains filled the state's coffers with silver and copper, while your deep fascination with the cosmos earned you the moniker of the Astrologer Prince. Your grand library and sweeping reforms laid the foundation for a cultured and deeply formidable state. = 向你致敬，尤利烏斯，布倫瑞克-呂訥堡公爵兼沃爾芬比特尔親王。雖然你曾注定要過平靜的神職生活，但你崛起成為統治者，並為你的人民開創了一個前所未有的繁榮時代。通過接受宗教改革並建立宏偉的黑爾姆施泰特大學，你為你的人民帶來了極大的啟蒙。作為早期現代一位真正的有遠見者，你在哈茨山的重商主義追求讓國家的金庫裝滿了白銀和黃銅，而你對宇宙的深深著迷為你贏得了“占星家親王”的綽號。你宏大的圖書館和徹底的改革為一個有教養且極為強大的國家奠定了基礎。
Astute Duke, the wealth of the Harz mountains and the wisdom of the Academia Julia lay at your disposal once more. Can you navigate the stars and fill your treasuries with the finest silver? Can you foster an enlightened realm where education, trade, and faith flourish in harmony? Can you build a civilization that will stand the test of time? = 精明的公爵，哈茨山的財富和尤利婭學院的智慧再次任你差遣。你能駕馭星辰，用最上等的白銀填滿你的國庫嗎？你能培育一個教育、貿易和信仰和諧繁榮的開明王國嗎？你能建立一個經得起時間考驗的文明嗎？
