Christian IV = 克里斯蒂安四世
Those lands which you have - yes, those. Well, sorry to tell you this, but they're actually mine, and I'm going to reclaim them. = 你擁有的那些土地——對，就是那些。好吧，很遺憾地告訴你，它們其實是我的，而且我打算把它們收回來。
Absolutely I will fight you! = 我絕對會和你戰鬥！
What a horrible, uncouth bastard you are. = 你真是個可怕又粗鄙的混蛋。
Urgh. You're such an arse, you know that? Now you've gone and sullied both our reputations. = 呃。你真是個混賬，你知道嗎？現在你把我們倆的名聲都給玷污了。
Glorious to meet you! Glorious! I am Christian IV, King of Denmark and Norway. I hope you can stomach your ale, my friend, because whilst you're with me, there's not a moment that you'll go sober, I'll see to that. = 見到你太榮幸了！太榮幸了！我是克里斯蒂安四世，丹麥和挪威國王。我希望你能喝得下你的麥芽酒，我的朋友，因為只要你和我在一起，我就不會讓你有清醒的片刻，我保證。
Greetings, you horrible little person. = 你好啊，你這個可怕的小人。
Good tidings upon thee, noble King Christian IV, leader of the Kingdoms of Denmark and Norway. Though the time that the three ancient Kingdoms of Scandinavia were one had past, you would inherit a powerful union of Denmark and Norway which dominated the peninsula. Heralded for your great and ambitious character, your 59 year reign would be one of the expansion of the Royal Navy and of Dano-Norwegian interests overseas. Though your clashes with Sweden for dominance over the Baltic Sea would ultimately falter, your endearing efforts to better the lives of your people, and your great love of music and art, would ensure your lasting legacy as a great king of the renaissance. = 願好運伴隨你，高貴的克里斯蒂安四世國王，丹麥和挪威王國的領袖。雖然斯堪的納維亞三個古老王國合而為一的時代已經過去，但你繼承了一個主宰半島的強大的丹麥-挪威聯盟。以你偉大而雄心勃勃的性格而聞名，你59年的統治時期是皇家海軍和丹麥-挪威海外利益擴張的時期。儘管你與瑞典爭奪波羅的海霸權的衝突最終受挫，但你為改善人民生活所作的不懈努力，以及你對音樂和藝術的熱愛，將確保你作為文藝復興時期偉大國王的持久遺產。
O beloved Christian, the Kingdoms of Denmark and Norway beckon the return of your rule to re-establish a powerful maritime empire. Can you heed the calling of the ancient crowns of Denmark and Norway? Can you, with good character, be the enlightened king that your people demand? Can you build a civilization that can stand the test of time? = 敬愛的克里斯蒂安，丹麥和挪威王國召喚你的回歸，以重建強大的海洋帝國。你能傾聽丹麥和挪威古老王冠的呼喚嗎？你能以高尚的品格，成為你的人民所要求的開明君主嗎？你能建立一個經得起時間考驗的文明嗎？  


