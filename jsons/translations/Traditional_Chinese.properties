Honour to you, Jan III Sobieski, King of Poland and Grand Duke of Lithuania. A brilliant tactician and fearless commander, you are remembered by history as the Lion of Lechistan. When the Ottoman Empire threatened to engulf the heart of Europe, it was you who rode down the hills of Vienna at the head of the largest cavalry charge in history. Your resounding victory saved Christendom and cemented the legendary status of your Winged Hussars. Under your reign, the Polish-Lithuanian Commonwealth stood as a bulwark of stability, culture, and undeniable military might. = 向你致敬，揚三世·索別斯基，波蘭國王兼立陶宛大公。作為一名出色的戰術家和無畏的指揮官，你被歷史銘記為「列希斯坦之獅」。當奧斯曼帝國威脅要吞噬歐洲的心臟時，正是你率領著歷史上最大規模的騎兵衝鋒，從維也納的山丘上呼嘯而下。你的巨大勝利拯救了基督教世界，並鞏固了你翼騎兵的傳奇地位。在你的統治下，波蘭-立陶宛聯邦成為了穩定、文化和無可爭辯的軍事實力的堡壘。
