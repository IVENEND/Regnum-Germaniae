My patience is exhausted. By the edge of the sword, I shall carve my victory from your realm. = 我的耐心已耗盡。我將用劍刃從你的王國中開闢出我的勝利。
I have survived rebellion and exile alike. Do you truly believe your meager forces can cast me from my throne? = 我在叛亂和流放中幸存下來。你真的認為你那微薄的兵力能把我從王位上趕下來嗎？
Once again, I am driven from my lands. But remember this: the Duke of Württemberg always returns. = 我再次被趕出我的土地。但請記住：符騰堡公爵總會回來的。
Your words are as empty as the treasuries of my youth. I care not for your judgment. = 你的話就像我年輕時的國庫一樣空虛。我不在乎你的評判。
I am Ulrich, Duke of Württemberg. Step carefully in my presence, for I have fought bitterly to hold these halls. = 我是符騰堡公爵烏爾里希。在我的面前請謹言慎行，因為我為了守住這些大殿進行了艱苦的戰鬥。
It would be wise to accept this arrangement, for the benefit of us both. = 為了我們雙方的利益，接受這個安排是明智的。
What business brings you before the Duke? = 什麼事把你帶到了公爵面前？
Make it brief, lest my temper get the better of us both. = 簡短點，免得我的脾氣影響我們倆。
Land of Free Cities = 自由城市之土
Welcome, turbulent and unyielding Ulrich, Duke of Württemberg. Thrust into power at a young age, your reign was defined by fierce conflict and unshakeable resilience. Though debt, peasant rebellion, and the wrath of the Swabian League once forced you into exile, your spirit would not be broken. Reclaiming your throne by the edge of the sword, you introduced the Protestant Reformation to Württemberg, securing a profound religious and cultural legacy for your duchy despite the bitter controversies that plagued your rule. = 歡迎你，桀驁不馴的符騰堡公爵烏爾里希。你年紀輕輕便掌握大權，你的統治時期充斥著激烈的衝突和不可動搖的韌性。儘管債務、農民起義和士瓦本同盟的憤怒曾迫使你流亡，但你的精神並未被擊潰。你用劍奪回了王位，將新教改革引入符騰堡，儘管你的統治飽受爭議，但仍為你的公國留下了深遠的宗教和文化遺產。
Defiant Duke, the people of Württemberg look to you for strength and salvation. Can you guide your realm through the fires of political turmoil and religious upheaval? Can you forge a lasting legacy of faith and power, ensuring your duchy is never again taken from you? Can you build a civilization that will stand the test of time? = 叛逆的公爵，符騰堡的人民指望著你的力量和拯救。你能帶領你的王國度過政治動蕩和宗教劇變的戰火嗎？你能鍛造信仰和權力的持久遺產，確保你的公國不再被奪走嗎？你能建立一個經得起時間考驗的文明嗎？
