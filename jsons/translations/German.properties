Ulrich von Württemberg = Ulrich von Württemberg
My patience is exhausted. By the edge of the sword, I shall carve my victory from your realm. = Meine Geduld ist erschöpft. Mit der Klinge des Schwertes werde ich meinen Sieg aus Eurem Reich herausschneiden.
I have survived rebellion and exile alike. Do you truly believe your meager forces can cast me from my throne? = Ich habe Rebellion und Exil gleichermaßen überlebt. Glaubt Ihr wirklich, dass Eure kümmerlichen Streitkräfte mich von meinem Thron stoßen können?
Once again, I am driven from my lands. But remember this: the Duke of Württemberg always returns. = Einmal mehr werde ich aus meinen Ländereien vertrieben. Aber merkt Euch eines: Der Herzog von Württemberg kehrt immer zurück.
Your words are as empty as the treasuries of my youth. I care not for your judgment. = Eure Worte sind so leer wie die Schatzkammern meiner Jugend. Euer Urteil kümmert mich nicht.
I am Ulrich, Duke of Württemberg. Step carefully in my presence, for I have fought bitterly to hold these halls. = Ich bin Ulrich, Herzog von Württemberg. Tretet in meiner Gegenwart vorsichtig auf, denn ich habe erbittert gekämpft, um diese Hallen zu halten.
It would be wise to accept this arrangement, for the benefit of us both. = Es wäre weise, diese Vereinbarung zu akzeptieren, zum Wohle von uns beiden.
What business brings you before the Duke? = Welch ein Anliegen führt Euch vor den Herzog?
Make it brief, lest my temper get the better of us both. = Macht es kurz, damit mein Temperament nicht mit uns beiden durchgeht.
Land of Free Cities = Land der Freien Städte
Welcome, turbulent and unyielding Ulrich, Duke of Württemberg. Thrust into power at a young age, your reign was defined by fierce conflict and unshakeable resilience. Though debt, peasant rebellion, and the wrath of the Swabian League once forced you into exile, your spirit would not be broken. Reclaiming your throne by the edge of the sword, you introduced the Protestant Reformation to Württemberg, securing a profound religious and cultural legacy for your duchy despite the bitter controversies that plagued your rule. = Willkommen, unruhiger und unerbittlicher Ulrich, Herzog von Württemberg. In jungen Jahren an die Macht gekommen, war Eure Herrschaft geprägt von heftigen Konflikten und unerschütterlicher Widerstandsfähigkeit. Obwohl Schulden, Bauernaufstände und der Zorn des Schwäbischen Bundes Euch einst ins Exil zwangen, ließ sich Euer Geist nicht brechen. Ihr erobertet Euren Thron mit dem Schwert zurück und führtet die protestantische Reformation in Württemberg ein, wodurch Ihr Eurem Herzogtum trotz der bitteren Kontroversen, die Eure Herrschaft plagten, ein tiefgreifendes religiöses und kulturelles Erbe sichertet.
Defiant Duke, the people of Württemberg look to you for strength and salvation. Can you guide your realm through the fires of political turmoil and religious upheaval? Can you forge a lasting legacy of faith and power, ensuring your duchy is never again taken from you? Can you build a civilization that will stand the test of time? = Trotziger Herzog, das Volk von Württemberg blickt auf der Suche nach Stärke und Erlösung zu Euch. Könnt Ihr Euer Reich durch die Feuer politischer Unruhen und religiöser Umwälzungen führen? Könnt Ihr ein dauerhaftes Erbe von Glaube und Macht schmieden und sicherstellen, dass Euch Euer Herzogtum nie wieder genommen wird? Könnt Ihr eine Zivilisation aufbauen, die die Zeit überdauert?
