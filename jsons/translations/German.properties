Julius = Julius
The stars have aligned against you, and so have my armies. By war, my realm shall be secured. = Die Sterne haben sich gegen Euch gewandt, und so auch meine Armeen. Durch Krieg wird mein Reich gesichert werden.
You dare strike at Wolfenbüttel? Every household in my realm is armed and trained. You will find no easy victory here. = Ihr wagt es, Wolfenbüttel anzugreifen? Jeder Haushalt in meinem Reich ist bewaffnet und ausgebildet. Ihr werdet hier keinen leichten Sieg finden.
My treasury is spent and my militia broken. I only pray my great libraries and universities survive your conquest. = Meine Schatzkammer ist geleert und meine Miliz gebrochen. Ich bete nur, dass meine großen Bibliotheken und Universitäten Eure Eroberung überstehen.
Even the heavens look upon you with disdain. I will not associate with such ignorance. = Sogar der Himmel blickt mit Verachtung auf Euch herab. Ich werde mich nicht mit solcher Ignoranz abgeben.
Welcome, traveler. I am Julius, Duke of Brunswick. May our meeting be as prosperous as the silver mines of the Harz. = Willkommen, Reisender. Ich bin Julius, Herzog von Braunschweig. Möge unser Treffen so wohlhabend sein wie die Silberminen des Harzes.
I have prepared a ledger for your review. It would be highly beneficial to consider this exchange. = Ich habe ein Kassenbuch zu Eurer Überprüfung vorbereitet. Es wäre äußerst vorteilhaft, diesen Austausch in Betracht zu ziehen.
What is it you seek? = Was ist Euer Begehr?
My time is better spent studying the heavens. Speak quickly. = Meine Zeit ist besser damit verbracht, die Sterne zu studieren. Sprecht schnell.
Schützenfest = Schützenfest
Honour to you, Julius, Duke of Brunswick-Lüneburg and Prince of Wolfenbüttel. Though once destined for a quiet clerical life, you rose to rule and ushered in an era of unprecedented prosperity for your lands. By embracing the Reformation and establishing the grand University of Helmstedt, you brought great enlightenment to your people. A true visionary of the early modern era, your mercantilist pursuits in the Harz mountains filled the state's coffers with silver and copper, while your deep fascination with the cosmos earned you the moniker of the Astrologer Prince. Your grand library and sweeping reforms laid the foundation for a cultured and deeply formidable state. = Ehre sei Euch, Julius, Herzog von Braunschweig-Lüneburg und Fürst von Wolfenbüttel. Obwohl einst für ein ruhiges klerikales Leben bestimmt, stiegt Ihr zur Macht auf und läutetet eine Ära beispiellosen Wohlstands für Eure Ländereien ein. Indem Ihr die Reformation annahmt und die großartige Universität Helmstedt gründetet, brachtet Ihr Eurem Volk große Aufklärung. Als wahrer Visionär der Frühen Neuzeit füllten Eure merkantilistischen Bestrebungen im Harz die Staatskassen mit Silber und Kupfer, während Eure tiefe Faszination für den Kosmos Euch den Beinamen des Astrologenprinzen einbrachte. Eure großartige Bibliothek und weitreichende Reformen legten den Grundstein für einen kultivierten und zutiefst beeindruckenden Staat.
Astute Duke, the wealth of the Harz mountains and the wisdom of the Academia Julia lay at your disposal once more. Can you navigate the stars and fill your treasuries with the finest silver? Can you foster an enlightened realm where education, trade, and faith flourish in harmony? Can you build a civilization that will stand the test of time? = Scharfsinniger Herzog, der Reichtum des Harzes und die Weisheit der Academia Julia stehen Euch einmal mehr zur Verfügung. Könnt Ihr die Sterne navigieren und Eure Schatzkammern mit dem feinsten Silber füllen? Könnt Ihr ein aufgeklärtes Reich fördern, in dem Bildung, Handel und Glaube in Harmonie gedeihen? Könnt Ihr eine Zivilisation aufbauen, die die Zeit überdauert?
