Philip I the Magnanimous = Philipp I. der Großmütige
The time for debate has passed. For the defense of our faith and our freedoms, we must take up the sword. = Die Zeit der Debatten ist vorbei. Zur Verteidigung unseres Glaubens und unserer Freiheiten müssen wir zum Schwert greifen.
You strike at us unjustly! But know that our resolve is fortified by divine providence, and we shall not break. = Ihr greift uns zu Unrecht an! Aber wisset, dass unsere Entschlossenheit durch göttliche Vorsehung gestärkt ist, und wir werden nicht brechen.
My armies may shatter and my lands may fall, but the truth we fought for can never be undone by mortal hands. = Meine Armeen mögen zerschlagen werden und meine Ländereien fallen, aber die Wahrheit, für die wir gekämpft haben, kann niemals durch sterbliche Hände rückgängig gemacht werden.
Your slander is but wind. History and the heavens shall judge my righteousness, not the likes of you. = Eure Verleumdung ist nichts als Wind. Die Geschichte und der Himmel werden über meine Rechtschaffenheit urteilen, nicht Euresgleichen.
Greetings. I am Philip, Landgrave of Hesse. I welcome you to my court; let us speak plainly and in good faith. = Seid gegrüßt. Ich bin Philipp, Landgraf von Hessen. Ich heiße Euch an meinem Hofe willkommen; lasst uns offen und in gutem Glauben sprechen.
Review this proposal. I trust you will find it to be mutually beneficial. = Prüft diesen Vorschlag. Ich vertraue darauf, dass Ihr ihn als beiderseitig vorteilhaft erachten werdet.
What tidings do you bring? = Welche Neuigkeiten bringt Ihr?
Make it brief. My patience for you wears thin. = Macht es kurz. Meine Geduld mit Euch geht zur Neige.
Hessian Mercenary = Hessischer Söldner
Hail to you, Philip the Magnanimous, Landgrave of Hesse and stalwart champion of the Protestant Reformation. Elevated by your unwavering conviction, you stood defiant against the might of the Holy Roman Emperor to protect the reformed faith. Through the Marburg Colloquy, you sought to unite the great theological minds of your age, and as a founding leader of the Schmalkaldic League, you forged a mighty alliance to defend the religious liberties of the German princes. Your legacy is one of fierce independence and religious zeal, forever etching Hesse into the annals of history. = Heil Euch, Philipp der Großmütige, Landgraf von Hessen und unbeirrbarer Verfechter der protestantischen Reformation. Erhoben durch Eure unerschütterliche Überzeugung, standet Ihr trotzig gegen die Macht des Kaisers des Heiligen Römischen Reiches, um den reformierten Glauben zu schützen. Durch das Marburger Religionsgespräch versuchtet Ihr, die großen theologischen Köpfe Eurer Zeit zu vereinen, und als ein Gründungsführer des Schmalkaldischen Bundes schmiedetet Ihr eine mächtige Allianz zur Verteidigung der religiösen Freiheiten der deutschen Fürsten. Euer Vermächtnis ist eines von erbitterter Unabhängigkeit und religiösem Eifer, das Hessen für immer in die Annalen der Geschichte einprägt.
Most magnanimous Landgrave, the faithful look to you once more for guidance and protection. Can you unite the fractured realms and stand strong against imperial tyranny? Can you ensure that the light of your reforms burns bright across the ages? Can you build a civilization that will stand the test of time? = Großmütigster Landgraf, die Gläubigen blicken einmal mehr auf der Suche nach Führung und Schutz zu Euch. Könnt Ihr die zersplitterten Reiche vereinen und der kaiserlichen Tyrannei standhalten? Könnt Ihr sicherstellen, dass das Licht Eurer Reformen hell durch alle Zeitalter leuchtet? Könnt Ihr eine Zivilisation aufbauen, die die Zeit überdauert?
