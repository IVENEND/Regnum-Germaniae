God is with you. Did you come to learn of our Lords teachings, heathen? I am Albert of Livonia, who shall bring faith to this land. = Gott ist mit Euch. Seid Ihr gekommen, um die Lehren unseres Herrn zu lernen, Heide? Ich bin Albert von Livland, der den Glauben in dieses Land bringen wird.
