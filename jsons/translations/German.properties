Hermann von Salza = Hermann von Salza
The time for diplomacy has passed. By the cross we bear and the swords we wield, we march to war. = Die Zeit der Diplomatie ist vorbei. Mit dem Kreuz, das wir tragen, und den Schwertern, die wir schwingen, marschieren wir in den Krieg.
You dare strike at the vanguard of faith? A grave error that my knights shall soon rectify. = Ihr wagt es, die Vorhut des Glaubens anzugreifen? Ein schwerer Fehler, den meine Ritter bald korrigieren werden.
God's will be done. Though our chapter closes today, the legacy of the Order shall never be erased. = Gottes Wille geschehe. Auch wenn unser Kapitel heute schließt, wird das Vermächtnis des Ordens niemals ausgelöscht werden.
Your words are as empty as your faith. The Order stands resolute against such slander. = Eure Worte sind so leer wie Euer Glaube. Der Orden steht entschlossen gegen solche Verleumdungen.
Greetings. I am Hermann von Salza, Grand Master of the Teutonic Order. May our meeting be guided by wisdom and peace. = Seid gegrüßt. Ich bin Hermann von Salza, Hochmeister des Deutschen Ordens. Möge unser Treffen von Weisheit und Frieden geleitet sein.
A proposal for our mutual benefit. I trust you will see its wisdom. = Ein Vorschlag zu unserem beiderseitigen Nutzen. Ich vertraue darauf, dass Ihr seine Weisheit erkennt.
What news do you bring? = Welche Neuigkeiten bringt Ihr?
Do not test my patience today. Speak swiftly. = Stellt meine Geduld heute nicht auf die Probe. Sprecht rasch.
Northern Crusade = Nördlicher Kreuzzug
Hail, Hermann von Salza, Grand Master of the Teutonic Knights. Through your masterful diplomacy and unwavering devotion, you transformed a humble crusading brotherhood into a formidable military and monastic order. A trusted confidant to both Pope and Holy Roman Emperor, your grand vision brought the crusading spirit to the shores of the Baltic. With sword and cross, you laid the foundations of the Teutonic Order's state, carving out a disciplined realm in Prussia that would echo through the annals of history. = Heil, Hermann von Salza, Hochmeister des Deutschen Ordens. Durch Eure meisterhafte Diplomatie und unerschütterliche Hingabe verwandelte Ihr eine bescheidene Kreuzfahrer-Bruderschaft in einen gewaltigen militärischen und monastischen Orden. Als vertrauter Berater sowohl des Papstes als auch des Kaisers des Heiligen Römischen Reiches, brachte Eure großartige Vision den Geist der Kreuzzüge an die Ufer der Ostsee. Mit Schwert und Kreuz legtet Ihr den Grundstein für den Deutschordensstaat und erschuft ein diszipliniertes Reich in Preußen, das in den Annalen der Geschichte nachhallen sollte.
Wise Grand Master, the northern frontiers call for your steadfast leadership once more. Can you marshal the brethren knights to bring order and faith to untamed lands? Will your diplomatic cunning secure the prosperity of your sovereign domain? Can you build a civilization that will stand the test of time? = Weiser Hochmeister, die nördlichen Grenzen rufen einmal mehr nach Eurer unerschütterlichen Führung. Könnt Ihr die Ordensritter sammeln, um Ordnung und Glauben in ungezähmte Lande zu bringen? Wird Eure diplomatische List den Wohlstand Eurer souveränen Herrschaft sichern? Könnt Ihr eine Zivilisation aufbauen, die die Zeit überdauert?
