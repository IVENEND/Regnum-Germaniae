God blesses you, Maximilian I of Bavaria. You were the calculating and devote Duke of the House of Wittelsbach putting Bavaria back in the Concerte of Europe after it being hold down after the Fall of Emperor Louis IV and inner dynastic struggles. It was the right time to rise House Wittelsbach up to greatness when the Reformation threatened to destroy Christianity in the german lands. You were the most devote and willing ally of the Emperor and made Bavaria the biggest catholic power within catholic states. = Gott segnet Euch, Maximilian I. von Bayern. Ihr wart der berechnende und fromme Herzog des Hauses Wittelsbach, der Bayern nach dem Sturz von Kaiser Ludwig IV. und inneren dynastischen Kämpfen wieder in das Konzert der europäischen Mächte zurückbrachte. Es war der richtige Zeitpunkt, das Haus Wittelsbach zur Größe zu erheben, als die Reformation das Christentum in den deutschen Landen zu zerstören drohte. Ihr wart der frömmste und willigste Verbündete des Kaisers und machtet Bayern zur größten katholischen Macht innerhalb der katholischen Staaten.
O' most piety Maximilian! The people are calling your name when praying for saviour of true faith and they thank the Virgin Mary for every of your deeds. Can you build a Civilization that stands the test of time? = O frommster Maximilian! Die Menschen rufen Euren Namen, wenn sie um die Rettung des wahren Glaubens beten, und sie danken der Jungfrau Maria für jede Eurer Taten. Könnt Ihr eine Zivilisation aufbauen, die die Zeit überdauert?
