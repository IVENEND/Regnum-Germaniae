Frederick Augustus I = Friedrich August I.
It is plain to see that you have no appreciation for the arts. Perhaps you will have an appreciation for war instead. = Es ist offensichtlich, dass Ihr keine Wertschätzung für die Künste habt. Vielleicht habt Ihr stattdessen eine Wertschätzung für den Krieg.
Once I have repelled your forces, I shall come to your palace and personally toss you from the window. = Sobald ich Eure Truppen zurückgeschlagen habe, werde ich zu Eurem Palast kommen und Euch persönlich aus dem Fenster werfen.
Treat my great palaces well, and I shall hold no ill-will against your victory here today. = Behandelt meine großen Paläste gut, und ich werde keinen Groll gegen Euren heutigen Sieg hegen.
I will not stand here and be insulted by the likes of you. = Ich werde nicht hier stehen und mich von Euresgleichen beleidigen lassen.
Greetings and welcome, I am Frederick Augustus I of Saxony. I beckon you to join me in tour of my magnificant palaces. = Seid gegrüßt und willkommen, ich bin Friedrich August I. von Sachsen. Ich lade Euch ein, mich auf einer Tour durch meine prächtigen Paläste zu begleiten.
Hm? = Hm?
You are such a bore... = Ihr seid so ein Langweiler...
Jewel of Europe = Juwel Europas
Welcome, Frederick Augustus I, elector of Saxony. You lead one of the cultural centres of Europe. Saxony is a modest country, with a wealth of art and architecture to its name. Elector to the Holy Roman Empire, Saxony rose to prominence during the 16th century, as home to the Protestant Reformation. In the 17th century, you joined Saxony in union with the Commonwealth of Poland-Lithuania, and embarked upon great projects which would make Dresden the envy of artists the world over. Even today, the legacy of your endeavours persist, and Saxony remains one of the most culturally autonomous states in Germany. = Willkommen, Friedrich August I., Kurfürst von Sachsen. Ihr führt eines der kulturellen Zentren Europas. Sachsen ist ein bescheidenes Land, das sich durch einen Reichtum an Kunst und Architektur auszeichnet. Als Kurfürstentum des Heiligen Römischen Reiches stieg Sachsen im 16. Jahrhundert als Heimat der protestantischen Reformation zu Bedeutung auf. Im 17. Jahrhundert verbandet Ihr Sachsen in einer Union mit Polen-Litauen und startetet großartige Projekte, die Dresden zum Neid von Künstlern auf der ganzen Welt machen würden. Noch heute besteht das Vermächtnis Eurer Bestrebungen fort, und Sachsen bleibt einer der kulturell autonomsten Staaten in Deutschland.
Strong and noble king, the great halls of Dresden's Palaces thirst for culture and enlightenment. Can you fill your cities with great works and monuments? Can you defend her sovereign territory and usher in a new golden age? Can you build a civilization that can stand the test of time? = Starker und edler König, die großen Säle der Dresdner Paläste dürsten nach Kultur und Aufklärung. Könnt Ihr Eure Städte mit großen Werken und Monumenten füllen? Könnt Ihr ihr souveränes Territorium verteidigen und ein neues goldenes Zeitalter einläuten? Könnt Ihr eine Zivilisation aufbauen, die die Zeit überdauert?
