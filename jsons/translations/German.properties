Christian IV = Christian IV.
Those lands which you have - yes, those. Well, sorry to tell you this, but they're actually mine, and I'm going to reclaim them. = Jene Ländereien, die Ihr besitzt – ja, genau diese. Nun, es tut mir leid, Euch das sagen zu müssen, aber sie gehören eigentlich mir, und ich werde sie zurückfordern.
Absolutely I will fight you! = Absolut, ich werde gegen Euch kämpfen!
What a horrible, uncouth bastard you are. = Was für ein schrecklicher, ungehobelter Bastard Ihr seid.
Urgh. You're such an arse, you know that? Now you've gone and sullied both our reputations. = Urgh. Ihr seid so ein Arsch, wisst Ihr das? Jetzt habt Ihr den Ruf von uns beiden ruiniert.
Glorious to meet you! Glorious! I am Christian IV, King of Denmark and Norway. I hope you can stomach your ale, my friend, because whilst you're with me, there's not a moment that you'll go sober, I'll see to that. = Herrlich, Euch kennenzulernen! Herrlich! Ich bin Christian IV., König von Dänemark und Norwegen. Ich hoffe, Ihr vertragt Euer Bier, mein Freund, denn solange Ihr bei mir seid, werdet Ihr keinen Moment nüchtern bleiben, dafür werde ich sorgen.
Greetings, you horrible little person. = Seid gegrüßt, Ihr schreckliche kleine Person.
Good tidings upon thee, noble King Christian IV, leader of the Kingdoms of Denmark and Norway. Though the time that the three ancient Kingdoms of Scandinavia were one had past, you would inherit a powerful union of Denmark and Norway which dominated the peninsula. Heralded for your great and ambitious character, your 59 year reign would be one of the expansion of the Royal Navy and of Dano-Norwegian interests overseas. Though your clashes with Sweden for dominance over the Baltic Sea would ultimately falter, your endearing efforts to better the lives of your people, and your great love of music and art, would ensure your lasting legacy as a great king of the renaissance. = Frohe Botschaft sei mit Euch, edler König Christian IV., Anführer der Königreiche von Dänemark und Norwegen. Obwohl die Zeit, in der die drei alten Königreiche Skandinaviens eins waren, vergangen ist, solltet Ihr eine mächtige Union aus Dänemark und Norwegen erben, welche die Halbinsel dominierte. Gefeiert für Euren großartigen und ehrgeizigen Charakter, war Eure 59-jährige Herrschaft geprägt vom Ausbau der Royal Navy und der dänisch-norwegischen Interessen in Übersee. Obwohl Eure Zusammenstöße mit Schweden um die Vorherrschaft über die Ostsee letztendlich scheitern sollten, würden Eure unermüdlichen Bemühungen, das Leben Eures Volkes zu verbessern, sowie Eure große Liebe zu Musik und Kunst Euer dauerhaftes Vermächtnis als ein großer König der Renaissance sichern.
O beloved Christian, the Kingdoms of Denmark and Norway beckon the return of your rule to re-establish a powerful maritime empire. Can you heed the calling of the ancient crowns of Denmark and Norway? Can you, with good character, be the enlightened king that your people demand? Can you build a civilization that can stand the test of time? = O geliebter Christian, die Königreiche Dänemark und Norwegen rufen nach der Rückkehr Eurer Herrschaft, um ein mächtiges maritimes Imperium wiederherzustellen. Könnt Ihr dem Ruf der alten Kronen Dänemarks und Norwegens folgen? Könnt Ihr mit gutem Charakter der aufgeklärte König sein, den Euer Volk verlangt? Könnt Ihr eine Zivilisation aufbauen, die die Zeit überdauert?


