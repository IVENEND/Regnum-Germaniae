Wilhelm Tell = Wilhelm Tell
Your defeat will be swift. I do not revel in drawn-out wars. = Eure Niederlage wird rasch sein. Ich erfreue mich nicht an in die Länge gezogenen Kriegen.
You might have won, but are you interested in a bet involving apples and crossbows? = Ihr mögt gewonnen haben, aber seid Ihr an einer Wette interessiert, bei der es um Äpfel und Armbrüste geht?
*takes his crossbow and shoots at you* = *nimmt seine Armbrust und schießt auf Euch*
Hail and honour to you, friend. I am Wilhelm Tell, hero of the simple folk and saviour of its freedom. = Heil und Ehre sei Euch, Freund. Ich bin Wilhelm Tell, Held des einfachen Volkes und Retter seiner Freiheit.
The Old Swiss Confederacy = Die Alte Eidgenossenschaft
Let the overtures tell of your great deeds, oh Wilhelm Tell, first Eidgenosse, folk legend, expert marksman, and he whose defiance and tyrannicide set the people of the old Swiss Confederacy free. The legends say you were born in Bürglen, Uri. Growing up to become a strong man, you grew to become disillusioned with the Habsburg emperors of Austria attempted domination of Uri and vowed to act. Becoming one of the conspirators of Werner Stauffacher, you resisted the Austrian Vogt of Altdorf, Albrecht Gessler. On your journey to the eventual assassination of Gessler, you partook in misadventures, including your famous splitting of the apple on your son’s head by a shot from your crossbow, your imprisonment, and escape from the Tellsplatte. Your assassination of Gessler led to a rebellion, which led to the formation of the Old Swiss Confederacy. Brave to the end, legend says you continued to fight the Austrians, and died trying to save a child from drowning.  = Lasst die Ouvertüren von Euren großen Taten erzählen, oh Wilhelm Tell, erster Eidgenosse, Volkslegende, meisterhafter Schütze und derjenige, dessen Trotz und Tyrannenmord das Volk der alten Schweizer Eidgenossenschaft befreite. Die Legenden besagen, dass Ihr in Bürglen, Uri, geboren wurdet. Als Ihr zu einem starken Mann heranwuchst, wurdet Ihr desillusioniert von der versuchten Vorherrschaft der habsburgischen Kaiser Österreichs über Uri und schwörtet zu handeln. Als einer der Verschwörer von Werner Stauffacher widerstandet Ihr dem österreichischen Vogt von Altdorf, Albrecht Gessler. Auf Eurer Reise zur schlussendlichen Ermordung Gesslers nahmt Ihr an Abenteuern teil, darunter Eure berühmte Spaltung des Apfels auf dem Kopf Eures Sohnes durch einen Schuss aus Eurer Armbrust, Eure Gefangenschaft und Flucht von der Tellsplatte. Eure Ermordung Gesslers führte zu einer Rebellion, die wiederum zur Gründung der Alten Eidgenossenschaft führte. Mutig bis zum Ende, so besagt die Legende, kämpftet Ihr weiter gegen die Österreicher und starbt bei dem Versuch, ein Kind vor dem Ertrinken zu retten.
Oh Wilhelm Tell, your people once again crave the daring, bravery and strength. You must awaken from your cave at the Rigi. But beware, the world has changed; new challenges must be conquered, and if you are to live up to your legend, you must once again rise to fight those who would seek to destroy you. Can you live up to the expectations of your people? Can you build a civilization that will stand the test of time? = Oh Wilhelm Tell, Euer Volk sehnt sich einmal mehr nach Wagemut, Tapferkeit und Stärke. Ihr müsst aus Eurer Höhle an der Rigi erwachen. Aber hütet Euch, die Welt hat sich verändert; neue Herausforderungen müssen bewältigt werden, und wenn Ihr Eurer Legende gerecht werden wollt, müsst Ihr Euch erneut erheben, um gegen diejenigen zu kämpfen, die Euch zu vernichten suchen. Könnt Ihr den Erwartungen Eures Volkes gerecht werden? Könnt Ihr eine Zivilisation aufbauen, die die Zeit überdauert?
