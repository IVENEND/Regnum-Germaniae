Greetings, I am Maximilian I of Bavaria, true defender of christian faith in this blessed lands. Do not dare to question my believes. = Seid gegrüßt, ich bin Maximilian I. von Bayern, der wahre Verteidiger des christlichen Glaubens in diesen gesegneten Landen. Wagt es nicht, meine Überzeugungen in Frage zu stellen.
