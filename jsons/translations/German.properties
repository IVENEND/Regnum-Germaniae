Matthias Corvinus = Matthias Corvinus
Your insolence has provoked this war, and I shall be happy to lead the Black Army to victory over you. = Eure Unverschämtheit hat diesen Krieg provoziert, und ich werde mit Freuden die Schwarze Armee zum Sieg über Euch führen.
Surely you had to know that one day there would be war between us. = Sicherlich musstet Ihr wissen, dass es eines Tages Krieg zwischen uns geben würde.
Today you wear the victor's laurels, but can you keep what you have taken? = Heute tragt Ihr die Lorbeeren des Siegers, aber könnt Ihr auch behalten, was Ihr genommen habt?
The harsh judgments of the ignorant carry no weight in my court. = Die harten Urteile der Unwissenden haben an meinem Hof kein Gewicht.
I am Matthias. I am King of Hungary, scourge of my foes, and defender of the faithful. Greetings. = Ich bin Matthias. Ich bin König von Ungarn, die Geißel meiner Feinde und Verteidiger der Gläubigen. Seid gegrüßt.
A fair exchange benefits both our realms. Review these terms. = Ein fairer Austausch nützt unseren beiden Reichen. Prüft diese Bedingungen.
Hussar Tradition = Husaren-Tradition
Hail to you, O' noble Matthias Corvinus, King of Hungary and Croatia. Rising to the throne amidst the turmoil of Europe, you forged a mighty realm renowned for both its martial prowess and its dazzling intellect. Your legendary Black Army stood as an unyielding bulwark against the Ottoman advance and secured your conquests in Bohemia and Austria. Yet, you were not merely a conqueror; as a true champion of the Renaissance, your grand court at Buda and the magnificent Bibliotheca Corviniana attracted scholars and artists from across the known world, cementing Hungary's legacy as a beacon of culture and strength. = Heil Euch, oh edler Matthias Corvinus, König von Ungarn und Kroatien. Inmitten der Wirren Europas den Thron besteigend, schmiedetet Ihr ein mächtiges Reich, das sowohl für seine kriegerische Stärke als auch für seinen schillernden Intellekt bekannt war. Eure legendäre Schwarze Armee stand als unnachgiebiges Bollwerk gegen den osmanischen Vormarsch und sicherte Eure Eroberungen in Böhmen und Österreich. Dennoch wart Ihr nicht nur ein Eroberer; als wahrer Champion der Renaissance zogen Euer großartiger Hof in Buda und die prächtige Bibliotheca Corviniana Gelehrte und Künstler aus der ganzen bekannten Welt an, womit Ungarns Vermächtnis als Leuchtfeuer der Kultur und Stärke gefestigt wurde.
Mighty Matthias, your feats at arms are matched only by the depths of your knowledge. Let your mighty Black Army serve as your strong hand in the battlefield, both as sword against your enemies and as shield protecting your faithful people, and ages to come will utter your name in awe. = Mächtiger Matthias, Eure Waffentaten werden nur von der Tiefe Eures Wissens übertroffen. Lasst Eure mächtige Schwarze Armee als Eure starke Hand auf dem Schlachtfeld dienen, sowohl als Schwert gegen Eure Feinde als auch als Schild, der Euer treues Volk schützt, und kommende Zeitalter werden Euren Namen in Ehrfurcht aussprechen.
