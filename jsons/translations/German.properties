René II = René II.
You have achieved what the boldest and most powerful men of the age could not. I would be awed, were I not so disgusted. = Ihr habt erreicht, was die kühnsten und mächtigsten Männer dieses Zeitalters nicht konnten. Ich wäre beeindruckt, wenn ich nicht so angewidert wäre.
Your ambitions are as transparent as they are tyrannical. I see through your lies, and the world shall know of them too. = Eure Ambitionen sind so durchschaubar wie tyrannisch. Ich durchschaue Eure Lügen, und die Welt wird ebenfalls von ihnen erfahren.
Well met, stranger! I am René II, and I rule these lands as their Duke. Let it be known that Lorraine has never been conquered, and has resisted foes far more fearsome than it! If you aim to conquer us, your armies will fall like the others. Feel free to try, though. I do enjoy a challenge. = Gut getroffen, Fremder! Ich bin René II., und ich herrsche über diese Lande als ihr Herzog. Lasst es bekannt sein, dass Lothringen niemals erobert wurde und weitaus furchteinflößenderen Feinden widerstanden hat! Wenn Ihr darauf abzielt, uns zu erobern, werden Eure Armeen wie die anderen fallen. Fühlt Euch jedoch frei, es zu versuchen. Ich genieße eine Herausforderung.
I bring a proposal that would benefit our realms. I suggest you look it over carefully. = Ich bringe einen Vorschlag, der unseren Reichen nützen würde. Ich schlage vor, dass Ihr ihn sorgfältig prüft.
Speak your mind. = Sagt, was Ihr denkt.
Make it quick. My patience for you wears thin. = Macht es kurz. Meine Geduld mit Euch geht zur Neige.
Legacy of Lotharingia = Erbe von Lotharingien
We salute you, René II, most valiant of princes, Hercules of our times, who dared challenge the Lion to combat! You rule as Duke of Lorraine, the heir to the old kingdom of Lotharingia, a land both in France and in the Holy Roman Empire. Your duchy is a bountiful and fertile one, but even more so than that, a fiercely independent one. Lorraine was never conquered, only inherited. And what better symbol of Lorrainian resilience is there than you, great René? As a young duke, your domain was threatened by the powerful and ambitious Charles the Bold of Burgundy, who swept into your proud duchy with a seemingly insurmountable modern army. Unbowed and undeterred, you and your allies struck back against the Burgundians, routing their armies at the gates of Nancy and slaying Lorraine's would-be conqueror! Your heroic deeds will live on forever, in history and in poetry. = Wir grüßen Euch, René II., den tapfersten der Fürsten, den Herkules unserer Zeit, der es wagte, den Löwen zum Kampf herauszufordern! Ihr herrscht als Herzog von Lothringen, dem Erben des alten Königreichs Lotharingien, einem Land sowohl in Frankreich als auch im Heiligen Römischen Reich. Euer Herzogtum ist reich und fruchtbar, aber noch mehr als das, erbittert unabhängig. Lothringen wurde nie erobert, nur geerbt. Und welches bessere Symbol für die Widerstandskraft Lothringens gibt es als Euch, großer René? Als junger Herzog wurde Euer Herrschaftsgebiet von dem mächtigen und ehrgeizigen Karl dem Kühnen von Burgund bedroht, der mit einer scheinbar unüberwindlichen modernen Armee in Euer stolzes Herzogtum einfiel. Ungebeugt und unbeirrt schlugt Ihr und Eure Verbündeten gegen die Burgunder zurück, triebt ihre Armeen vor den Toren von Nancy in die Flucht und erschlugt den Möchtegern-Eroberer Lothringens! Eure heldenhaften Taten werden in der Geschichte und in der Poesie ewig weiterleben.
Valiant René, the people of Lorraine once more call out for a tenacious hand to see them through the tribulations that lie ahead. Will you once more defend your duchy, and bring it into a new age of prestige and prosperity? Will you build a civilization that can stand the test of time? = Tapferer René, das Volk von Lothringen ruft einmal mehr nach einer hartnäckigen Hand, die es durch die vor ihm liegenden Drangsale führt. Werdet Ihr Euer Herzogtum ein weiteres Mal verteidigen und es in ein neues Zeitalter von Ansehen und Wohlstand führen? Werdet Ihr eine Zivilisation aufbauen, die die Zeit überdauert?
