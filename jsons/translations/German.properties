Frederick the Great = Friedrich der Große
Gravely, war must be done. = Schweren Herzens, der Krieg muss geführt werden.
Perhaps I will not survive this cruel misfortunate. But your defeat I shall ensure. = Vielleicht werde ich dieses grausame Unglück nicht überleben. Aber Eure Niederlage werde ich sicherstellen.
You are skilled in war, that much is clear. But what spirit compels you to tear asunder my kingdom and its arts? = Ihr seid kriegserfahren, das ist offensichtlich. Aber welcher Geist zwingt Euch dazu, mein Königreich und seine Künste in Stücke zu reißen?
My name will not be sullied so easily. = Mein Name wird nicht so leicht beschmutzt werden.
Hail and honour to you, friend. I am Frederick, commander of these forces and king of Prussia. Speak freely. = Heil und Ehre sei Euch, Freund. Ich bin Friedrich, Befehlshaber dieser Truppen und König von Preußen. Sprecht frei.
I have a trade for you to consider. = Ich habe einen Handel, den Ihr in Betracht ziehen solltet.
I will listen. = Ich werde zuhören.
