Julius Echter von Mespelbrunn = Julius Echter von Mespelbrunn
The wicked must be cleansed from this earth. I bring the sword of divine justice to your very gates. = Die Bösen müssen von dieser Erde gereinigt werden. Ich bringe das Schwert der göttlichen Gerechtigkeit direkt an Eure Tore.
You dare strike at the Lord's chosen shepherd? My faith is an absolute fortress, and your armies shall break upon its walls. = Ihr wagt es, den vom Herrn erwählten Hirten anzugreifen? Mein Glaube ist eine absolute Festung, und Eure Armeen werden an ihren Mauern zerbrechen.
The Lord tests his faithful in mysterious ways. Though my earthly realm falls to ruin, the spiritual foundations I have laid shall never crumble. = Der Herr prüft seine Gläubigen auf mysteriöse Wege. Auch wenn mein irdisches Reich in Ruinen fällt, werden die spirituellen Fundamente, die ich gelegt habe, niemals bröckeln.
Your words are the babble of the faithless. I shall pray for your swift and righteous judgment. = Eure Worte sind das Geplapper der Ungläubigen. Ich werde für Euer rasches und gerechtes Urteil beten.
God's blessings upon you, traveler. I am Julius Echter, Prince-Bishop of Würzburg. Step into the light of our faith and speak your purpose. = Gottes Segen sei mit Euch, Reisender. Ich bin Julius Echter, Fürstbischof von Würzburg. Tretet ein in das Licht unseres Glaubens und nennt Euer Anliegen.
A proposal of worldly goods. Review it with a careful and righteous mind. = Ein Vorschlag über irdische Güter. Prüft ihn mit sorgfältigem und gerechtem Verstand.
May the Lord guide our words. = Möge der Herr unsere Worte leiten.
Do not test my patience, lest you find my mercy lacking. = Stellt meine Geduld nicht auf die Probe, sonst werdet Ihr feststellen, dass es mir an Barmherzigkeit mangelt.
A Rugged Land of Fortresses = Ein raues Land voller Festungen
Greetings to you, Julius Echter von Mespelbrunn, devoted Prince-Bishop of Würzburg. As a resolute pillar of the Holy Roman Empire, you guided your bishopric through a turbulent era of religious strife, standing as a fierce champion of the Counter-Reformation. Your legacy is not only one of unyielding spiritual fervor, but of magnificent creation. From the distinctive towering spires of your countless churches to the establishment of the great University and the Juliusspital, your tireless ambition transformed Würzburg into a true bastion of faith, education, and architectural splendor. = Seid gegrüßt, Julius Echter von Mespelbrunn, ergebener Fürstbischof von Würzburg. Als entschlossene Säule des Heiligen Römischen Reiches führtet Ihr Euer Bistum durch eine turbulente Ära religiöser Auseinandersetzungen und standet als erbitterter Vorkämpfer der Gegenreformation. Euer Vermächtnis ist nicht nur eines von unnachgiebigem spirituellen Eifer, sondern auch von großartigen Schöpfungen. Von den markanten Turmspitzen Eurer zahllosen Kirchen bis zur Gründung der großen Universität und des Juliusspitals verwandelte Euer unermüdlicher Ehrgeiz Würzburg in eine wahre Bastion des Glaubens, der Bildung und der architektonischen Pracht.
Zealous shepherd of your flock, the grand halls of Marienberg Fortress await your divine mandate once more. Can you foster a realm of unrivaled devotion and enlightenment? Can you shield your lands from heresy and guide your people to salvation through faith and monumental works? Can you build a civilization that will stand the test of time? = Eifriger Hirte Eurer Herde, die großen Hallen der Festung Marienberg erwarten erneut Euer göttliches Mandat. Könnt Ihr ein Reich unvergleichlicher Hingabe und Aufklärung fördern? Könnt Ihr Eure Ländereien vor Ketzerei schützen und Euer Volk durch Glauben und monumentale Werke zur Erlösung führen? Könnt Ihr eine Zivilisation aufbauen, die die Zeit überdauert?
