Albert of Buxhoeveden, God's blessing is with you and your ambitions. As the Livonian Chronicles are telling it to this day, you were the noble founder of Riga, once you called for a perpetual crusade against the heathens at the baltic shores to avenge your fallen brother in faith, who was Bishop before. But it was you o' brave Albert, who rose to Arch Bishop and even Prince-Bishop in the Reich with your glory that was in the conquest of the Land of Mary, founding Riga and securing it with the Order of the Sword Brethren. = Albert von Buxthoeven, Gottes Segen ist mit Euch und Euren Ambitionen. Wie es die Livländische Chronik noch heute erzählt, wart Ihr der edle Gründer von Riga, sobald Ihr zu einem ewigen Kreuzzug gegen die Heiden an den baltischen Küsten aufrieft, um Euren gefallenen Glaubensbruder, der zuvor Bischof war, zu rächen. Aber Ihr wart es, o tapferer Albert, der mit Eurem Ruhm in der Eroberung des Marienlandes, der Gründung von Riga und der Sicherung durch den Schwertbrüderorden zum Erzbischof und sogar zum Fürstbischof im Reich aufstieg.
Ambitious Albert of Riga the heathens are on the rise again, the fertile lands, tranquil waters and dark forrests are waiting for your Excellency. Can you build a civilization that can stand the test of time? = Ehrgeiziger Albert von Riga, die Heiden erheben sich erneut, die fruchtbaren Ländereien, ruhigen Gewässer und dunklen Wälder warten auf Eure Exzellenz. Könnt Ihr eine Zivilisation aufbauen, die die Zeit überdauert?
