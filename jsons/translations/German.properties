Vaclav II = Wenzel II.
You have given me no other option. By war, I shall defend my peoples' freedoms. = Ihr habt mir keine andere Wahl gelassen. Durch Krieg werde ich die Freiheiten meines Volkes verteidigen.
You are a coward to attack me so brazenly. = Ihr seid ein Feigling, mich so unverschämt anzugreifen.
You have defeated me now, but one day my people will carve out a new kingdom. = Ihr habt mich jetzt besiegt, aber eines Tages wird mein Volk ein neues Königreich erschaffen.
You are more of a fool than you look, then. = Dann seid Ihr wohl ein größerer Narr, als Ihr ausseht.
I am Vaclav II, king of Bohemia. I am the ruler of the Lands of the Crown of Saint Wenceslas, and I bid you welcome. = Ich bin Wenzel II., König von Böhmen. Ich bin der Herrscher der Länder der Wenzelskrone und heiße Euch willkommen.
Yes? = Ja?
Speak if you must. = Sprecht, wenn Ihr müsst.
The Hussite Wars = Die Hussitenkriege
Hail the mighty King Vaclav II, ruler of the lands of the Crown of Saint Wenceslas. The Kingdom of Bohemia lies within the conclaves of European power, between the Holy Roman Empire in the west and the Kingdom of Poland in the east. An important elector to the Holy Roman Emperors and champion of the Hussite cause, Bohemian history espouses a nation of great and fierce pride, and serves as a reminder of the once noble Kingdom which lay at the crossroads of Europe's east and west. = Heil dem mächtigen König Wenzel II., Herrscher der Ländereien der Wenzelskrone. Das Königreich Böhmen liegt in den Konklaven der europäischen Macht, zwischen dem Heiligen Römischen Reich im Westen und dem Königreich Polen im Osten. Als wichtiger Kurfürst der römisch-deutschen Kaiser und Verfechter der hussitischen Sache, spiegelt die böhmische Geschichte eine Nation von großem und erbittertem Stolz wider und dient als Erinnerung an das einst edle Königreich, das an der Kreuzung von Europas Osten und Westen lag.
Proud monarch, a resurgance of Czech identity has instilled in your people their desire for a sovereign nation once more. Can you restore the Crown Lands of Bohemia? Where once rose great castles and Kings of great character, can you once again bring pride to the Bohemian homelands? Can you build a civilization to stand the test of time? = Stolzer Monarch, ein Wiederaufleben der tschechischen Identität hat Eurem Volk erneut den Wunsch nach einer souveränen Nation eingeflößt. Könnt Ihr die böhmischen Kronländer wiederherstellen? Wo sich einst große Burgen erhoben und Könige von großem Charakter regierten, könnt Ihr den böhmischen Heimatlanden erneut Stolz bringen? Könnt Ihr eine Zivilisation aufbauen, die die Zeit überdauert?
