James VI = James VI.
By the will of God, I continue this quest to bring His word to your lands. For you could not see reason, it must be by war. = Nach dem Willen Gottes setze ich diese Mission fort, um Sein Wort in Eure Lande zu bringen. Da Ihr keine Vernunft annehmen wolltet, muss es durch Krieg geschehen.
God hath christened my right to this throne, and for so long as I live you shall not take it from me. = Gott hat mein Recht auf diesen Thron gesegnet, und solange ich lebe, werdet Ihr ihn mir nicht nehmen.
You dealt this great kingdom a mighty blow, and I go now in despair. = Ihr habt diesem großartigen Königreich einen gewaltigen Schlag versetzt, und ich gehe nun in Verzweiflung.
God will not tolerate his act of indecency. = Gott wird diesen Akt der Unanständigkeit nicht tolerieren.
I am James VI, christened as by God king of Scotland. I am a staunch believer in my divine right to serve as both judge and judged on behalf of my people, before God. Can you say the same? = Ich bin Jakob VI., von Gott zum König von Schottland gesalbt. Ich glaube fest an mein göttliches Recht, im Namen meines Volkes vor Gott sowohl Richter als auch Gerichteter zu sein. Könnt Ihr dasselbe von Euch behaupten?
You wish to speak? Then do so. = Ihr wollt sprechen? Dann tut das.
I have little time for heathens and heretics. Make it quick. = Ich habe wenig Zeit für Heiden und Ketzer. Macht es kurz.
Last of the Free = Die Letzten der Freien
God hath christened this day, O' wise and devoted King James of Scotland, England, and Ireland. Barely a child at the age of your ascension, you would come to inherit the thrones of the three ancient and noble Kingdoms of the British Isles. With your mind set to what makes for a righteous monarch, your reign would bring forward an age of great innovation and the beginnings of a colonial empire. A patron of the arts and sciences, as well as a devoted servant to God and realm, your reign would author the greatest testimony to the strength of the kinship of all Britons, and stands as a legacy of a realm united in the quest for glory and harmony. = Gott hat diesen Tag gesegnet, o weiser und hingebungsvoller König Jakob von Schottland, England und Irland. Kaum ein Kind im Alter Eurer Thronbesteigung, solltet Ihr die Throne der drei alten und edlen Königreiche der Britischen Inseln erben. Mit Eurem Sinn dafür, was einen gerechten Monarchen ausmacht, sollte Eure Herrschaft ein Zeitalter großer Innovationen und die Anfänge eines Kolonialreichs einleiten. Als Förderer von Kunst und Wissenschaft sowie als ergebener Diener für Gott und das Reich, wurde Eure Herrschaft zum größten Zeugnis für die Stärke der Verbundenheit aller Briten und steht als Vermächtnis eines Reiches, das im Streben nach Ruhm und Harmonie vereint ist.
By God's will, your throne stands alone between harmony and disunity. Can you behold the pursuit of knowledge and keep in your heart devotion to God and people? Can you usher in a new golden age of culture and knowledge? Can you build a civilization that can stand the test of time? = Durch Gottes Willen steht Euer Thron allein zwischen Harmonie und Zwietracht. Könnt Ihr das Streben nach Wissen aufrechterhalten und die Hingabe an Gott und das Volk in Eurem Herzen bewahren? Könnt Ihr ein neues goldenes Zeitalter der Kultur und des Wissens einleiten? Könnt Ihr eine Zivilisation aufbauen, die die Zeit überdauert?
