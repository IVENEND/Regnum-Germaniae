An Army with a State = Eine Armee mit einem Staat
Honour to you, O' brilliant and tactful Frederick the Great. You are the King of Prussia, a state conceived in piety and bloodshed; elevated to the heights of power by her exceptional skill on the battlefield. Celebrated for your military genius and your enlightened ideals, your victories against Austria and Poland would be your defining legacy, ensuring for Prussia not only a place amongst the great powers of Europe but also amongst military minds to come. = Ehre sei Euch, o brillanter und taktvoller Friedrich der Große. Ihr seid der König von Preußen, eines Staates, der in Frömmigkeit und Blutvergießen empfangen wurde; erhoben zu den Höhen der Macht durch seine außergewöhnlichen Fähigkeiten auf dem Schlachtfeld. Gefeiert für Euer militärisches Genie und Eure aufgeklärten Ideale, sollten Eure Siege gegen Österreich und Polen Euer entscheidendes Vermächtnis werden und Preußen nicht nur einen Platz unter den Großmächten Europas, sondern auch unter den militärischen Köpfen der Zukunft sichern.
Most enlightened King, Prussia's military glory once more awaits. Can you march her soldiers into battle and return triumphant against all manner of foe? Can you make Prussia a bastion of free and effective government? Can you build a civilization that will stand the test of time? = Erleuchtetster König, der militärische Ruhm Preußens erwartet Euch erneut. Könnt Ihr ihre Soldaten in die Schlacht führen und siegreich gegen jede Art von Feind zurückkehren? Könnt Ihr Preußen zu einer Bastion freier und effektiver Regierung machen? Könnt Ihr eine Zivilisation aufbauen, die die Zeit überdauert?
