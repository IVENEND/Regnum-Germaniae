Bogislaw X = Bogislaw X.
The Griffin bares its claws. The time for diplomacy has passed, and I now bring war to your lands. = Der Greif entblößt seine Klauen. Die Zeit der Diplomatie ist vorbei, und ich bringe nun den Krieg in Eure Ländereien.
You dare threaten the sovereignty of Pomerania? We have weathered far fiercer storms than you. = Ihr wagt es, die Souveränität Pommerns zu bedrohen? Wir haben weitaus schlimmere Stürme überstanden als Euch.
I guess this is the end of a united Pomerania... = Ich schätze, das ist das Ende eines vereinten Pommerns...
Greetings, wise ruler! I am Bogislaw X, the first to unite the whole of Pomerania in centuries. Some call me 'the Great' - perhaps you will soon be one of them? = Seid gegrüßt, weiser Herrscher! Ich bin Bogislaw X., der Erste, der ganz Pommern seit Jahrhunderten vereint hat. Manche nennen mich 'den Großen' - vielleicht gehört Ihr auch bald dazu?
A prosperous exchange on the Baltic benefits us both. I ask that you consider this offer. = Ein florierender Austausch auf der Ostsee kommt uns beiden zugute. Ich bitte Euch, dieses Angebot in Betracht zu ziehen.
What news do you bring to my court? = Welche Neuigkeiten bringt Ihr an meinen Hof?
State your business, and make it brief. = Nennt Euer Anliegen, und macht es kurz.
Pirates of the Baltic Sea = Piraten der Ostsee
Hail, great Bogislaw X, noble Duke of Pomerania! Pomerania has a long and fractured past, a crossroads of Germanic and Slavic cultures along the coast of the mighty Baltic Sea. Before you rose to power, the Duchy of Pomerania was fractured for centuries, a number of squabbling rulers torn and tossed between the spheres of Poland, Brandenburg and other powers in northern Europe. But under your wise rulership, Pomerania was united into one territory once more! Thanks to your wise diplomatic hand, your newly unified Duchy was able to assert itself as a state of its own, free of any hegemonic influence. It is of no question that you earned the moniker of Bogislaw the Great! = Heil Euch, großer Bogislaw X., edler Herzog von Pommern! Pommern hat eine lange und zerklüftete Vergangenheit, ein Schnittpunkt germanischer und slawischer Kulturen entlang der Küste der mächtigen Ostsee. Bevor Ihr an die Macht kamt, war das Herzogtum Pommern jahrhundertelang zersplittert, eine Reihe streitender Herrscher, hin- und hergerissen zwischen den Einflusssphären Polens, Brandenburgs und anderer Mächte in Nordeuropa. Aber unter Eurer weisen Herrschaft wurde Pommern wieder zu einem einzigen Territorium vereint! Dank Eurer weisen diplomatischen Hand konnte sich Euer neu vereintes Herzogtum als eigener Staat behaupten, frei von jeglichem hegemonialen Einfluss. Es steht außer Frage, dass Ihr Euch den Beinamen Bogislaw der Große verdient habt!
Oh wise Duke, Pomerania would not stay united for long after your reign, and even today is fractured and split between the powers that always threatened its independence. But your people rejoice at your return! Will you restore the prestige of the House of Griffins? Will you build a civilization to stand the test of time? = Oh weiser Herzog, Pommern sollte nach Eurer Herrschaft nicht lange vereint bleiben, und selbst heute ist es zersplittert und aufgeteilt zwischen den Mächten, die stets seine Unabhängigkeit bedrohten. Aber Euer Volk frohlockt über Eure Rückkehr! Werdet Ihr das Ansehen des Greifenhauses wiederherstellen? Werdet Ihr eine Zivilisation aufbauen, die die Zeit überdauert?
