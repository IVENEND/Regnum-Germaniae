You seek to usurp my rightful domain? I assure you, I shall not be driven into exile so easily this time. = Ihr wollt mein rechtmäßiges Herrschaftsgebiet an Euch reißen? Ich versichere Euch, ich werde mich dieses Mal nicht so leicht ins Exil treiben lassen.
It seems the winter of my reign has come at last. The crown slips from my grasp, and I am cast into the cold once more. = Es scheint, der Winter meiner Herrschaft ist endlich gekommen. Die Krone entgleitet meinem Griff, und ich werde einmal mehr in die Kälte verstoßen.
Your slander is nothing but the desperate rambling of a false claimant. = Eure Verleumdung ist nichts weiter als das verzweifelte Geschwätz eines falschen Anwärters.
Greetings to you. I am Frederick V, Elector Palatine and rightful King of Bohemia. Let us speak of diplomacy and peace, while we still can. = Seid gegrüßt. Ich bin Friedrich V., Kurfürst von der Pfalz und rechtmäßiger König von Böhmen. Lasst uns von Diplomatie und Frieden sprechen, solange wir noch können.
I bring a proposal of trade. Let us see if our interests align. = Ich bringe einen Handelsvorschlag. Lasst uns sehen, ob unsere Interessen übereinstimmen.
I am listening. = Ich höre zu.
State your business quickly, for the shadows grow long. = Nennt Euer Anliegen schnell, denn die Schatten werden länger.
Palatinate Tolerance = Pfälzer Toleranz
Honour to you, Elector Frederick V of the Palatinate. Thrust into the center of a great religious struggle, your realm of the Electoral Palatinate stood as a leading voice for the Protestant cause in the Holy Roman Empire. When the rebellious estates of Bohemia offered you their crown, your bold acceptance ignited the devastating Thirty Years' War. Though your reign in Prague was tragically brief, earning you the immortal moniker of the 'Winter King', your legacy as a champion of your faith and the visionary behind Heidelberg's magnificent gardens remains forever etched in the annals of European history. = Ehre sei Euch, Kurfürst Friedrich V. von der Pfalz. In das Zentrum eines großen religiösen Ringens gedrängt, stand Euer Reich der Kurpfalz als führende Stimme für die protestantische Sache im Heiligen Römischen Reich. Als die rebellischen Stände Böhmens Euch ihre Krone anboten, entfachte Eure kühne Annahme den verheerenden Dreißigjährigen Krieg. Obwohl Eure Herrschaft in Prag tragisch kurz war und Euch den unsterblichen Beinamen des "Winterkönigs" einbrachte, bleibt Euer Vermächtnis als Vorkämpfer Eures Glaubens und als Visionär hinter Heidelbergs prächtigen Gärten für immer in den Annalen der europäischen Geschichte verankert.
Resolute Winter King, the time has come to secure a crown that will not melt away with the changing of the seasons. Can you protect the Palatinate from the ambitions of rival empires and guide your people through the bitter storms of war? Will your legacy be one of fleeting glory, or will you build a civilization that stands the test of time? = Entschlossener Winterkönig, die Zeit ist gekommen, eine Krone zu sichern, die nicht mit dem Wechsel der Jahreszeiten dahinschmilzt. Könnt Ihr die Pfalz vor den Ambitionen rivalisierender Imperien schützen und Euer Volk durch die bitteren Stürme des Krieges führen? Wird Euer Vermächtnis eines von flüchtigem Ruhm sein, oder werdet Ihr eine Zivilisation aufbauen, die die Zeit überdauert?
